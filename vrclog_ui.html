// ---------- Thumbnails via Python (images from api.vrchat.cloud need the cookie) ----------
const THUMBS = {};
let thumbPending = new Set(), thumbTimer = 0;
function thumbStyle(url) {
  if (!url) return "";
  if (url.startsWith("https://assets.vrchat.com/")) return `background-image:url('${esc(url)}')`;  // Public, can be loaded directly
  if (THUMBS[url]) return `background-image:url('${THUMBS[url]}')`;
  thumbPending.add(url);
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(() => { api("thumbs", [...thumbPending]); thumbPending = new Set(); }, 200);
  return "";
}
function thumbAttr(url) { return url ? `data-thumb="${esc(url)}" style="${thumbStyle(url)}"` : ""; }
window.onThumbs = (list) => {
  for (const { url, img } of list) {
    THUMBS[url] = img;
    document.querySelectorAll(`[data-thumb="${CSS.escape(url)}"]`).forEach(el => el.style.backgroundImage = `url('${img}')`);
  }
};
function apiError(r) { toast(r?.error === 401 ? t("needLogin") : `${t("errGeneric")}${r?.message ? " — " + r.message : ""}`); }
function confirmBtn(btn, action) {  // First click = ask, second click within 3 s = do it
  if (btn.dataset.armed) { delete btn.dataset.armed; action(); return; }
  btn.dataset.armed = "1";
  const old = btn.innerHTML;
  btn.classList.add("armed");
  btn.innerHTML = t("confirm");
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.classList.remove("armed"); btn.innerHTML = old; } }, 3000);
}

// Convert the image to PNG and shrink it to VRChat's size limit before uploading
async function uploadFile(file) {
  if (!file) return;
  const tab = INV.tab, max = tab === "gallery" ? 2048 : 1024;
  if (tab === "emoji") return openEmk([file]);
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); })
    .catch(() => null);
  if (!img) return toast(t("errGeneric"));
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, max / Math.max(w, h));
  if (tab !== "gallery") { w = h = Math.round(Math.min(max, Math.max(w, h) * scale)); }  // Emoji/stickers are square
  else { w = Math.round(w * scale); h = Math.round(h * scale); }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  if (tab === "gallery") ctx.drawImage(img, 0, 0, w, h);
  else {  // Center with contain
    const s = Math.min(w / img.naturalWidth, h / img.naturalHeight), dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }
  INV.uploading = true; renderView();
  const r = await api("upload_image", tab, c.toDataURL("image/png"), tab === "sticker" ? { maskTag: "square" } : {});
  INV.uploading = false;
  if (!r?.ok) { renderView(); return apiError(r); }
  (INV.data[tab] ||= []).unshift(r.ok);
  toast(t("uploaded")); renderView();
}

// ---------- Animated emoji maker (idea from VRCEmoji by Wakamu: github.com/Wakamu/VRCEmoji) ----------
// VRChat takes animated emoji as a 1024×1024 PNG sprite sheet, frames left→right, top→bottom
// Grid size depends on frame count: ≤4 = 2×2 (512px per frame), ≤16 = 4×4 (256px), ≤64 = 8×8 (128px)
const EMK_STYLES = ["aura", "bats", "bees", "bounce", "cloud", "confetti", "crying", "dislike", "fire", "idea", "lasers", "like", "magnet",
  "mistletoe", "money", "noise", "orbit", "pizza", "rain", "rotate", "shake", "snow", "snowball", "spin", "splash", "stop", "zzz"];
const EMK = { frames: [], start: 0, end: 0, count: 16, fps: 10, autoFps: true, fit: "contain", key: false, keyColor: [0, 255, 0], tol: 60,
              loop: "linear", style: "aura", busy: false, name: "emoji", sheet: null, raw: null, timer: 0, timerFps: 0, tick: 0, shown: 0, q: 0 };
const emkGrid = n => n <= 1 ? 1 : n <= 4 ? 2 : n <= 16 ? 4 : 8;
// Frame to show at this tick (pingpong = forward then backward)
function emkIndex(tick, n, loop) {
  if (loop === "pingpong" && n > 2) { const i = tick % (2 * n - 2); return i < n ? i : 2 * n - 2 - i; }
  return tick % n;
}

function openEmk(files) {
  if (S.emkStyle && EMK_STYLES.includes(S.emkStyle)) EMK.style = S.emkStyle;
  $("eOverlay").classList.add("show");
  buildEmk();
  if (files?.length) emkLoad(files);
}
function closeEmk() { $("eOverlay").classList.remove("show"); clearInterval(EMK.timer); EMK.timer = EMK.timerFps = 0; }

async function sniffType(file) {
  const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const s = String.fromCharCode(...b);
  if (s.startsWith("GIF8")) return "image/gif";
  if (s.startsWith("RIFF") && s.slice(8, 12) === "WEBP") return "image/webp";
  if (b[0] === 0x89 && s.slice(1, 4) === "PNG") return "image/png";
  if (b[0] === 0xff && b[1] === 0xd8) return "image/jpeg";
  if (s.slice(4, 8) === "ftyp") return /^avi[fs]/.test(s.slice(8, 12)) ? "image/avif" : "video/mp4";
  if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return "video/webm";
  return file.type || "";
}
// Read a file into frames [{bmp, d: milliseconds}], scaled to at most 512px to save memory
async function emkDecode(file) {
  const type = await sniffType(file);
  const MAX = 512, LIMIT = 400, out = [];
  const size = (w, h) => { const k = Math.min(1, MAX / Math.max(w, h)); return { resizeWidth: Math.max(1, Math.round(w * k)), resizeHeight: Math.max(1, Math.round(h * k)), resizeQuality: "high" }; };

      const more = await webpFrames(file, size, LIMIT).catch(e => (console.warn(e), []));

    }

}

// Decode GIF ourselves (LZW + disposal) — used when the browser has no ImageDecoder
async function gifFrames(file, size, LIMIT) {

    const c = u[p++];
    if (c === 0x21) {
      const label = u[p++];
      if (label === 0xF9) {
        const f = u[p + 1];
        gce = { disp: f >> 2 & 7, trans: f & 1 ? u[p + 4] : -1, delay: (u[p + 2] | u[p + 3] << 8) * 10 };
      }

    } else if (c === 0x2C) {

      const minCode = u[p++], idx = gifLzw(minCode, subBlocks(), fw * fh);

      const rows = [];

  const clear = 1 << minCode, eoi = clear + 1, out = new Uint8Array(npix);
  const prefix = new Int16Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);

      if (code === eoi) return out;

// Split animated WebP (ANMF) into frames and composite them ourselves using offset / blend / dispose
async function webpFrames(file, size, LIMIT) {
  const u = new Uint8Array(await file.arrayBuffer());
  const le = (p, n) => { let v = 0; for (let i = n - 1; i >= 0; i--) v = v * 256 + u[p + i]; return v; };

  if (!x) return [];
  const W = le(x.p + 4, 3) + 1, H = le(x.p + 7, 3) + 1;
  const cv = new OffscreenCanvas(W, H), g = cv.getContext("2d"), out = [];
  const riff = parts => {
    const len = 4 + parts.reduce((a, b) => a + b.length, 0), h = new Uint8Array(8);
    h.set([82, 73, 70, 70, len & 255, len >> 8 & 255, len >> 16 & 255, len >>> 24]);
    return new Blob([h, new Uint8Array([87, 69, 66, 80]), ...parts], { type: "image/webp" });
  };
  for (const f of top.filter(c => c.id === "ANMF").slice(0, LIMIT)) {
    const fx = le(f.p, 3) * 2, fy = le(f.p + 3, 3) * 2, fw = le(f.p + 6, 3) + 1, fh = le(f.p + 9, 3) + 1;
    const dur = le(f.p + 12, 3), flags = u[f.p + 15];
    const sub = chunks(f.p + 16, f.p + f.n), alph = sub.find(c => c.id === "ALPH");

      const v = new Uint8Array(18); v.set([86, 80, 56, 88, 10, 0, 0, 0, 16]);
      v.set([(fw - 1) & 255, (fw - 1) >> 8 & 255, (fw - 1) >> 16 & 255, (fh - 1) & 255, (fh - 1) >> 8 & 255, (fh - 1) >> 16 & 255], 12);
      parts.unshift(v);
    }
    const bmp = await createImageBitmap(riff(parts));
    if (flags & 2) g.clearRect(fx, fy, fw, fh);  // no-blend = replace the area
    g.drawImage(bmp, fx, fy); bmp.close();

    if (flags & 1) g.clearRect(fx, fy, fw, fh);  // dispose to background
  }

}

async function emkLoad(files) {
  files = [...files];
  if (!files.length || EMK.busy) return;
  EMK.busy = "decode"; buildEmk();
  try {
    let frames = [];
    if (files.length > 1) {  // Multiple files = one frame per file, sorted by name
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      for (const f of files.slice(0, 400)) frames.push({ bmp: (await emkDecode(f))[0].bmp, d: 100 });
    } else frames = await emkDecode(files[0]);
    if (!frames.length) throw new Error("no frames");
    if (frames.length === 1 && files.length === 1) toast(t("emk_still"));
    EMK.frames.forEach(f => f.bmp.close());
    Object.assign(EMK, { frames, start: 0, end: frames.length - 1, count: Math.min(frames.length, 16), want: Math.min(frames.length, 16), autoFps: true,
                         name: files[0].name.replace(/\.[^.]+$/, "") || "emoji" });
  } catch (e) { console.warn(e); toast(t("emk_err")); }
  EMK.busy = false; buildEmk();
}

function emkSet(k, v, rebuild) {
  EMK[k] = v;
  if (k === "start" && EMK.end < v) EMK.end = v;
  if (k === "end" && EMK.start > v) EMK.start = v;
  if (k === "count") EMK.want = v;
  // Selected range has a single frame = 1 still cell; otherwise use the user's chosen count (kept when the range moves)
  EMK.count = EMK.end === EMK.start ? 1 : EMK.want || EMK.count;
  if (k === "fps") EMK.autoFps = false;
  if (rebuild) buildEmk(); else emkQueue();
}
function emkQueue() { if (!EMK.q) EMK.q = requestAnimationFrame(() => { EMK.q = 0; emkRender(); }); }

function emkRow(ic, col, label, control, hint, hintId) {
  return `<div class="srow"><span class="tile" style="--c:var(--${col})">${icon(ic)}</span>
    <span class="label">${label}${hint !== undefined ? `<span class="hint" ${hintId ? `id="${hintId}"` : ""}>${hint}</span>` : ""}</span>${control}</div>`;
}
function emkSeg(key, options) {
  return `<div class="segmented">${Object.entries(options).map(([v, label]) =>
    `<button class="${String(EMK[key]) === v ? "on" : ""}" onclick="emkSet('${key}',${JSON.stringify(v).replace(/"/g, "'")},true)">${label}</button>`).join("")}</div>`;
}
function emkRange(id, min, max, val, key) {
  return `<input type="range" id="${id}" min="${min}" max="${max}" value="${val}" oninput="emkSet('${key}',+this.value)"><span class="val" id="${id}v"></span>`;
}

            `<button data-q="${q}" onclick="emkSet('count',${q})">${t("emk_q" + q)} ${q}</button>`).join("")}</div>`)}

          ${EMK.key ? emkRow("droplet", "green", t("emk_tol"), `<input type="color" id="emkC" value="${hex}"

// Pick frames from the chosen range spread evenly over time (so the speed matches the original)
function emkPicks() {
  const fr = EMK.frames.slice(EMK.start, EMK.end + 1);
  const total = fr.reduce((a, f) => a + f.d, 0), picks = [];
  for (let k = 0; k < EMK.count; k++) {
    let t = total * k / EMK.count, i = 0;
    while (i < fr.length - 1 && t >= fr[i].d) { t -= fr[i].d; i++; }
    picks.push(fr[i]);
  }
  return { picks, total };
}

function emkRender() {
  if (!EMK.frames.length || !$("emkPv")) return;
  const { picks, total } = emkPicks();
  if (EMK.autoFps) EMK.fps = Math.max(1, Math.min(64, Math.round(EMK.count * 1000 / total)));
  const g = emkGrid(EMK.count), cell = 1024 / g;
  const c = EMK.sheet ||= document.createElement("canvas");
  c.width = c.height = 1024;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, 1024, 1024);
  ctx.imageSmoothingQuality = "high";
  picks.forEach((f, k) => {
    const b = f.bmp, sc = (EMK.fit === "cover" ? Math.max : Math.min)(cell / b.width, cell / b.height);
    const w = b.width * sc, h = b.height * sc, x = (k % g) * cell, y = Math.floor(k / g) * cell;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, cell, cell); ctx.clip();
    ctx.drawImage(b, x + (cell - w) / 2, y + (cell - h) / 2, w, h);
    ctx.restore();
  });
  EMK.raw = ctx.getImageData(0, 0, 1024, 1024);
  if (EMK.key) {  // Chroma key: colors near the picked color become transparent, with slightly soft edges
    const out = new ImageData(new Uint8ClampedArray(EMK.raw.data), 1024, 1024), d = out.data;
    const [kr, kg, kb] = EMK.keyColor, t1 = EMK.tol, t2 = t1 * 1.35, t1q = t1 * t1, t2q = t2 * t2;
    for (let p = 0; p < d.length; p += 4) {
      const dr = d[p] - kr, dg = d[p + 1] - kg, db = d[p + 2] - kb, q = dr * dr + dg * dg + db * db;
      if (q < t1q) d[p + 3] = 0;
      else if (q < t2q) d[p + 3] = Math.min(d[p + 3], 255 * (Math.sqrt(q) - t1) / (t2 - t1));
    }
    ctx.putImageData(out, 0, 0);
  }
  const sh = $("emkSh").getContext("2d");
  sh.clearRect(0, 0, 512, 512);
  sh.drawImage(c, 0, 0, 512, 512);
  // Numbers and controls that depend on other values
  const set = (id, v, txt) => { const el = $(id); if (el) { el.value = v; $(id + "v").textContent = txt ?? v; } };
  set("emkS", EMK.start, EMK.start + 1); set("emkE", EMK.end, EMK.end + 1);
  set("emkN", EMK.count); set("emkF", EMK.fps); set("emkT", EMK.tol);
  $("emkGh").textContent = EMK.count === 1 ? t("emk_static") : t("emk_grid", g, cell);
  $("emkAuto").classList.toggle("on", EMK.autoFps);
  document.querySelectorAll("#emkQ button").forEach(b => b.classList.toggle("on", +b.dataset.q === EMK.count));
  if (EMK.timerFps !== EMK.fps || !EMK.timer) emkAnimate();
}

function emkAnimate() {
  clearInterval(EMK.timer);
  EMK.timerFps = EMK.fps;
  EMK.timer = setInterval(() => {
    const pv = $("emkPv");
    if (!pv || !EMK.sheet) return;
    const n = EMK.count, g = emkGrid(n), cell = 1024 / g, i = EMK.shown = emkIndex(EMK.tick++, n, EMK.loop);
    const ctx = pv.getContext("2d");
    ctx.clearRect(0, 0, 512, 512);
    ctx.drawImage(EMK.sheet, (i % g) * cell, Math.floor(i / g) * cell, cell, cell, 0, 0, 512, 512);
  }, 1000 / EMK.fps);
}

// Click the preview = pick a color from the source image (before background removal) and turn on chroma key
function emkPick(e, pv) {
  if (!EMK.raw) return;
  const r = pv.getBoundingClientRect(), g = emkGrid(EMK.count), cell = 1024 / g, i = EMK.shown;
  const x = Math.min(cell - 1, Math.floor((e.clientX - r.left) / r.width * cell)) + (i % g) * cell;
  const y = Math.min(cell - 1, Math.floor((e.clientY - r.top) / r.height * cell)) + Math.floor(i / g) * cell;
  const p = (y * 1024 + x) * 4, d = EMK.raw.data;
  if (d[p + 3] < 10) return;  // Already-transparent pixel
  EMK.keyColor = [d[p], d[p + 1], d[p + 2]];
  emkSet("key", true, true);
}

function emkFileName() { return `${EMK.name}_${EMK.count}frames_${EMK.fps}fps`; }
async function emkSave() {
  emkFlush();
  if (!EMK.sheet) return;
  if (await api("save_png", EMK.sheet.toDataURL("image/png"), emkFileName())) toast(t("emk_saved"));
}
async function emkUpload() {
  emkFlush();
  if (!EMK.sheet || EMK.busy) return;
  const png = EMK.sheet.toDataURL("image/png");
  const animated = EMK.count > 1;
  const fields = { animationStyle: EMK.style || "aura", maskTag: "square",
                   ...(animated ? { frames: EMK.count, framesOverTime: EMK.fps, loopStyle: EMK.loop } : {}) };
  S.emkStyle = fields.animationStyle; save();
  EMK.busy = "upload";
  document.querySelectorAll(".emk-actions .btn").forEach(b => b.disabled = true);
  document.querySelector(".emk-actions .primary").lastChild.textContent = t("uploading");
  const r = await api("upload_image", animated ? "emojianimated" : "emoji", png, fields);
  EMK.busy = false;
  if (!r?.ok) { buildEmk(); return apiError(r); }
  (INV.data.emoji ||= []).unshift(r.ok);
  toast(t("uploaded")); closeEmk();
  if (view === "inventory") renderView();
}

// Play the animated emoji in a tile (shift the sprite sheet one frame at a time)
setInterval(() => {
  const now = performance.now() / 1000;
  document.querySelectorAll(".iimg[data-frames]").forEach(el => {
    const n = +el.dataset.frames, g = emkGrid(n), i = emkIndex(Math.floor(now * (+el.dataset.fps || 10)), n, el.dataset.loop);
    el.style.backgroundSize = `${g * 100}% ${g * 100}%`;
    el.style.backgroundPosition = `${(i % g) / (g - 1) * 100}% ${Math.floor(i / g) / (g - 1) * 100}%`;
  });
}, 33);

// ---------- Toolbar buttons ----------
function togglePause() {
  paused = !paused;
  $("pauseBtn").innerHTML = icon(paused ? "play" : "pause");
  $("pauseBtn").title = t(paused ? "resume" : "pause");
  $("pauseBtn").classList.toggle("on", paused);
  if (!paused) render();
  updateSubtitle();
}
function clearLog() { events = []; render(); updateSubtitle(); }
function toggleInspector(force, persist = true) {
  const show = force === undefined ? $("inspector").classList.contains("hidden") : force;
  $("inspector").classList.toggle("hidden", !show);
  $("inspBtn").classList.toggle("on", show);
  if (persist) { S.inspector = show; save(); }
}

// ---------- Settings page ----------
let settingsOpen = false, resetArmed = false, settingsView = "main", login = {};
function openSettings(view = "main") {
  settingsOpen = true; resetArmed = false; settingsView = view; login = {};
  buildSettings(); $("overlay").classList.add("show");
}
function closeSettings() { settingsOpen = false; $("overlay").classList.remove("show"); }
function setS(key, value) {
  S[key] = value;
  save();
  if (key === "lang") applyLang();
  if (["showDate", "showPics"].includes(key)) render();
  if (key === "animFrames") document.querySelectorAll(".avatar[data-av]").forEach(fillAvatar);
  if (key === "onTop") api("set_on_top", value);
  applyAppearance();
  buildSettings();
}

function srow(ic, col, label, control, hint) {
  return `<div class="srow"><span class="tile" style="--c:var(--${col})">${icon(ic)}</span>
          <span class="label">${label}${hint ? `<span class="hint">${hint}</span>` : ""}</span>${control}</div>`;
}
function seg(key, options) {
  return `<div class="segmented">${Object.entries(options).map(([v, label]) =>
    `<button class="${S[key] === v ? "on" : ""}" onclick="setS('${key}','${v}')">${label}</button>`).join("")}</div>`;
}
function sw(key) {
  return `<label class="switch"><input type="checkbox" ${S[key] ? "checked" : ""} onchange="setS('${key}',this.checked)"></label>`;
}

// ---------- login ----------
function buildLogin() {
  const is2fa = settingsView === "2fa";
  const methods = login.methods || [];
  const email = methods.includes("emailOtp");
  const method = login.recovery ? "otp" : email ? "emailOtp" : "totp";
  $("sheet").innerHTML = `
    <div class="sheet-head">
      <button class="btn" onclick="settingsView='main';buildSettings()">${t("back")}</button>
      <h1 style="text-align:center">${t(is2fa ? "twoFA" : "account")}</h1>${xBtn("closeSettings()")}
    </div>
    <div class="sheet-body">
      <div class="card"><form class="form" onsubmit="event.preventDefault();${is2fa ? `doVerify('${method}')` : "doLogin()"}">
        ${is2fa ? `
          <div style="text-align:center;color:var(--text2)">${t(login.recovery ? "useRecovery" : email ? "twoFAEmail" : "twoFAApp")}</div>
          <input class="field code-field" id="fCode" autocomplete="one-time-code" inputmode="${login.recovery ? "text" : "numeric"}" maxlength="${login.recovery ? 20 : 6}">
          ${!email && !login.recovery && methods.includes("otp") ? `<a href="#" style="color:var(--accent);text-align:center;font-size:12px" onclick="login.recovery=true;buildLogin();return false">${t("useRecovery")}</a>` : ""}
        ` : `
          <input class="field" id="fUser" placeholder="${t("username")}" autocomplete="username" spellcheck="false">
          <input class="field" id="fPass" type="password" placeholder="${t("password")}" autocomplete="current-password">
        `}
        <div class="err" id="fErr"></div>
        <button class="btn primary" id="fBtn" type="submit">${icon(is2fa ? "shield-check" : "log-in")}<span>${t(is2fa ? "verify" : "signIn")}</span></button>
        ${is2fa ? "" : `<div class="note">${icon("lock")}<span>${t("pwNote")}</span></div>
`}
      </form></div>
    </div>`;
  setTimeout(() => $(is2fa ? "fCode" : "fUser")?.focus(), 50);
}

function loginError(code, is2fa) {
  return t(code === 0 ? "errNet" : code === 429 ? "errRate" : is2fa ? "errCode" : "errLogin");
}
function busy(on, label, ic) {
  const b = $("fBtn"); if (b) { b.disabled = on; b.innerHTML = (on ? '<i class="btn-spin"></i>' : icon(ic)) + `<span>${esc(label)}</span>`; }
}

async function doLogin() {
  const user = $("fUser").value.trim(), pass = $("fPass").value;
  if (!user || !pass) return;
  busy(true, t("signingIn"));
  const res = await api("vrc_login", user, pass);
  $("fPass") && ($("fPass").value = "");
  if (res?.need2fa) { login = { methods: res.need2fa }; settingsView = "2fa"; buildLogin(); return; }
  if (res?.ok) { settingsView = "main"; buildSettings(); return; }
  busy(false, t("signIn"), "log-in");
  $("fErr").textContent = loginError(res?.error, false);
}

async function doVerify(method) {
  const code = $("fCode").value.trim();
  if (!code) return;
  busy(true, t("signingIn"));
  const res = await api("vrc_verify", method, code);
  if (res?.ok) { settingsView = "main"; buildSettings(); return; }
  busy(false, t("verify"), "shield-check");
  $("fErr").textContent = loginError(res?.error, true);
  $("fCode").select();
}

function accountCard() {
  if (!AUTH.loggedIn) {
    return srow("circle-user-round", "gray", `${t("notSignedIn")}`,
      `<button class="btn primary" onclick="settingsView='login';buildLogin()">${t("signIn")}</button>`, t("signInHint"));
  }
  return `<div class="srow"><span id="meAv"></span>
            <span class="label"><b>${esc(AUTH.name)}</b><span class="hint">${t("signedIn")}</span></span>
            <button class="btn" onclick="api('vrc_logout')">${t("signOut")}</button></div>`;
}

function buildSettings() {
  if (settingsView !== "main") return buildLogin();
  const themes = ["auto", "light", "dark"].map(v => `
    <button class="theme-opt ${S.theme === v ? "on" : ""}" onclick="setS('theme','${v}')">
      <span class="theme-prev prev-${v}"></span>${t("theme" + v[0].toUpperCase() + v.slice(1))}</button>`).join("");
  const accents = Object.entries(ACCENTS).map(([k, c]) =>
    `<button class="dot ${S.accent === k ? "on" : ""}" style="--d:${c}" title="${k}" onclick="setS('accent','${k}')">${icon("check")}</button>`).join("");
  const d = dark() ? 0 : 1;
  const walls = Object.entries(WALLPAPERS).map(([k, w]) =>
    `<button class="swatch ${S.wallpaper === k ? "on" : ""}" title="${L().wp[k]}" onclick="setS('wallpaper','${k}')"
       style="background:linear-gradient(135deg,${w[d][0]},${w[d][1]} 45%,${w[d][2]})"></button>`).join("");

  $("sheet").innerHTML = `
    <div class="sheet-head"><h1>${t("settings")}</h1>${xBtn("closeSettings()")}</div>
    <div class="sheet-body">
      <div class="sec-title">${t("account")}</div>
      <div class="card">
        ${accountCard()}
        ${srow("user-round", "purple", t("showPics"), sw("showPics"))}
      </div>

      <div class="sec-title">${t("general")}</div>
      <div class="card">
        ${srow("languages", "indigo", t("language"), `<select class="fsel" onchange="setS('lang',this.value)">${Object.entries(LANGS)
          .map(([k, v]) => `<option value="${k}" ${S.lang === k ? "selected" : ""}>${v}</option>`).join("")}</select>`)}
        ${srow("a-large-small", "blue", t("textSize"), seg("size", { s: t("sizeS"), m: t("sizeM"), l: t("sizeL") }))}
        ${srow("type", "purple", t("font"), fontSelect())}
        ${srow("calendar", "red", t("showDate"), sw("showDate"))}
        ${srow("list", "gray", t("compact"), sw("compact"), t("compactHint"))}
        ${srow("pin", "orange", t("onTop"), sw("onTop"), t("onTopHint"))}
      </div>

      <div class="sec-title">${t("appearance")}</div>
      <div class="card">
        <div class="themes">${themes}</div>
        ${srow("palette", "pink", t("accent"), `<div class="dots">${accents}</div>`)}
        ${srow("image", "teal", t("wallpaper"), `<div class="swatches">${walls}</div>`)}
        ${srow("droplet", "blue", t("glass"),
          `<input type="range" min="0" max="100" value="${S.glass}" oninput="S.glass=+this.value;applyAppearance()" onchange="setS('glass',+this.value)">`,
          t("glassHint"))}
      </div>

      <div class="card" style="margin-top:8px">${srow("sparkles", "orange", t("animFrames"), sw("animFrames"), t("animFramesHint"))}</div>

      <div class="sec-title">${t("data")}</div>
      <div class="card">
        ${srow("trash-2", "gray", t("clearCache"),
          `<button class="btn" onclick="api('vrc_clear_cache');toast(t('cacheCleared'))">${t("clear2")}</button>`)}
        ${srow("rotate-ccw", "red", t("resetAll"),
          `<button class="btn danger ${resetArmed ? "armed" : ""}" onclick="resetAll()">${t(resetArmed ? "confirm" : "reset")}</button>`)}
      </div>

      <div class="sec-title">${t("upd_sec")}</div>
      <div class="card">
        ${srow("refresh-cw", "green", t("upd_check"), updButton(), updStatus())}
        ${srow("download", "blue", t("upd_auto"), sw("autoUpdate"), t("upd_autoHint"))}
      </div>

      <div class="sec-title">${t("about")}</div>
      <div class="card about">
        <div class="app-icon">${LOGO_SVG}</div>
        <b>VRC Nook</b>
        <span>${t("version", VERSION)}</span><br>
        <strong style="color:var(--text)">iriewiew</strong><br>
        <span>${t("credits")}</span>
      </div>
    </div>`;
  if (AUTH.loggedIn) $("meAv")?.replaceWith(makeAvatar(AUTH.id, AUTH.name));
}

function resetAll() {
  if (!resetArmed) { resetArmed = true; buildSettings(); setTimeout(() => { if (resetArmed) { resetArmed = false; if (settingsOpen) buildSettings(); } }, 3000); return; }
  resetArmed = false;
  S = { ...DEFAULTS };
  for (const n in KINDS) enabled[n] = KINDS[n].default;
  save();
  api("set_on_top", false);
  applyAppearance();
  toggleInspector(true, false);
  applyLang();
  buildSettings();
  toast(t("resetDone"));
}

// ---------- Shortcuts / search / misc ----------
let searchTimer;
$("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); renderView(); }, 150);
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "f") { e.preventDefault(); $("search").focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === ",") { e.preventDefault(); openSettings(); }
  if (e.key === "Escape") {
    if ($("pOverlay").classList.contains("show")) closeProfile();
    else if (settingsOpen) closeSettings();
    else if (document.activeElement === $("search")) { $("search").value = ""; query = ""; render(); }
  }
});

let toastTimer;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

// Resize the window from the bottom-right corner (frameless window)
$("grip").addEventListener("mousedown", e => {
  e.preventDefault();
  const sx = e.screenX, sy = e.screenY, w = window.outerWidth, h = window.outerHeight;
  let raf = 0;
  const move = ev => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => api("resize", w + ev.screenX - sx, h + ev.screenY - sy));
  };
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move);
  addEventListener("mouseup", up);
});
</script>
