<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>VRC Nook</title>
<style>
:root {
  --font: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Leelawadee UI", "Yu Gothic UI", "Malgun Gothic", "Microsoft YaHei UI", sans-serif;
  --mono: "SF Mono", "Cascadia Mono", Consolas, monospace;
  --accent: #0a84ff;
  --text: rgba(255,255,255,.92);
  --text2: rgba(235,235,245,.6);
  --text3: rgba(235,235,245,.32);
  --glass-rgb: 40,40,46;
  --glass-a: .43;
  --glass: rgba(var(--glass-rgb), var(--glass-a));
  --sheet: rgba(36,36,40,.82);
  --card: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.14);
  --stroke-in: rgba(255,255,255,.22);
  --hover: rgba(255,255,255,.07);
  --sep: rgba(255,255,255,.08);
  --shadow: 0 10px 40px rgba(0,0,0,.35);
  --track: rgba(120,120,128,.36);
  --seg-on: rgba(99,99,102,.9);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a; --purple:#bf5af2;
  --pink:#ff375f; --teal:#40c8e0; --indigo:#5e5ce6; --gray:#8e8e93; --mint:#00c7be; --brown:#ac8e68;
  --wall-1:#1a2a6c; --wall-2:#6a3093; --wall-3:#b21f66; --wall-4:#0f4c75; --wall-base:#101018;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --text: rgba(0,0,0,.88);
  --text2: rgba(60,60,67,.62);
  --text3: rgba(60,60,67,.32);
  --glass-rgb: 255,255,255;
  --sheet: rgba(246,246,248,.86);
  --card: rgba(255,255,255,.7);
  --stroke: rgba(255,255,255,.7);
  --stroke-in: rgba(255,255,255,.95);
  --hover: rgba(0,0,0,.05);
  --sep: rgba(0,0,0,.07);
  --shadow: 0 10px 40px rgba(30,40,80,.18);
  --track: rgba(120,120,128,.2);
  --seg-on: #fff;
  --blue:#007aff; --green:#28cd41; --red:#ff3b30; --orange:#ff9500; --yellow:#ffcc00; --purple:#af52de;
  --pink:#ff2d55; --teal:#30b0c7; --indigo:#5856d6; --gray:#8e8e93; --mint:#00c7be; --brown:#a2845e;
  --wall-base:#eef1f8;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font: 13px/1.45 var(--font); color: var(--text); background: var(--wall-base);
  -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  /* Font size: zoom the whole page, then divide sizes by the zoom so it fits the window without overflowing */
  zoom: var(--z, 1); width: calc(100vw / var(--z, 1)); height: calc(100vh / var(--z, 1));
}
svg.i { display: block; flex-shrink: 0; }
/* Tahoe-style gradient wallpaper behind the glass */
.wallpaper {
  position: fixed; inset: -10%; z-index: 0; filter: blur(60px) saturate(140%); transition: background .4s;
  background:
    radial-gradient(40% 50% at 15% 20%, var(--wall-1), transparent 70%),
    radial-gradient(45% 55% at 85% 15%, var(--wall-2), transparent 70%),
    radial-gradient(50% 50% at 70% 90%, var(--wall-3), transparent 70%),
    radial-gradient(45% 60% at 10% 95%, var(--wall-4), transparent 70%),
    var(--wall-base);
}
.glass {
  background: var(--glass);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow), inset 0 1px 0 var(--stroke-in);
}
.app { position: relative; z-index: 1; display: flex; height: 100%; padding: 10px; gap: 10px; }

/* Icons in rounded-square tiles, like System Settings */
.tile { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; flex-shrink: 0;
        color: #fff; background: var(--c);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.18); }
.tile svg { width: 15px; height: 15px; stroke-width: 2.2; }

/* ---------- Sidebar ---------- */
.sidebar { width: 280px; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.traffic { display: flex; gap: 8px; padding: 16px 18px 10px; }
.tl { width: 13px; height: 13px; border-radius: 50%; border: none; padding: 0; display: grid; place-items: center;
      color: rgba(0,0,0,.55); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
.tl svg { width: 9px; height: 9px; stroke-width: 3.2; opacity: 0; }
.traffic:hover .tl svg { opacity: 1; }
.tl.close { background: #ff5f57; } .tl.min { background: #febc2e; } .tl.max { background: #28c840; }
.side-title { font-size: 11px; font-weight: 600; color: var(--text2); padding: 8px 20px 4px; }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.group { margin: 4px 0 12px; }
.group-title { font-size: 11px; font-weight: 600; color: var(--text3); padding: 6px 10px 4px; letter-spacing: .02em; }
.toggle-row { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 10px; }
.toggle-row:hover { background: var(--hover); }
.toggle-row .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
/* macOS-style switch */
.switch { position: relative; width: 32px; height: 19px; flex-shrink: 0; display: block; }
.switch input { appearance: none; margin: 0; width: 100%; height: 100%; border-radius: 99px; display: block;
                background: var(--track); transition: background .2s; }
.switch input:checked { background: var(--accent); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%;
                 background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.3,1.4,.5,1);
                 pointer-events: none; }
.switch:has(input:checked)::after { transform: translateX(13px); }
.side-footer { padding: 10px 12px 14px; border-top: 1px solid var(--sep); }
.segmented { display: flex; background: var(--track); border-radius: 9px; padding: 2px; gap: 2px; }
.segmented button { flex: 1; border: none; background: transparent; color: var(--text); font: 500 12px var(--font);
                    padding: 4px 10px; border-radius: 7px; white-space: nowrap; }
.segmented button:hover { background: var(--hover); }
.segmented button.on, .segmented button:active { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.18); }

/* ---------- Main ---------- */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 4px 0 8px; min-height: 52px; }
.titles { min-width: 0; flex: 1; pointer-events: none; }
.world { font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtitle { font-size: 11.5px; color: var(--text2); white-space: nowrap; }
.capsule { display: flex; align-items: center; border-radius: 99px; padding: 3px; gap: 2px; }
.icon-btn { border: none; background: transparent; color: var(--text); width: 34px; height: 30px; border-radius: 99px;
            display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { background: var(--hover); }
.icon-btn.on { background: var(--accent); color: #fff; }
.search { display: flex; align-items: center; gap: 6px; border-radius: 99px; padding: 0 12px; height: 36px; width: 230px; color: var(--text2); }
.search svg { width: 14px; height: 14px; }
.search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font: 13px var(--font); min-width: 0; }
.search input::placeholder { color: var(--text3); }

.content { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.log { flex: 1; overflow-y: auto; padding: 6px 10px 14px; user-select: text; }
.row { display: flex; align-items: center; gap: 10px; padding: 4px 10px; border-radius: 10px; min-height: 32px; }
.row:hover { background: var(--hover); }
.row .time { font: 11.5px var(--mono); color: var(--text3); flex-shrink: 0; white-space: nowrap; }
.row .tile { width: 22px; height: 22px; border-radius: 6px; }
.row .tile svg { width: 13px; height: 13px; }
.row .val { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .pill { font-size: 11px; color: var(--text2); background: var(--track); border-radius: 99px; padding: 1px 8px; flex-shrink: 0; white-space: nowrap; }
.row.dim .val { color: var(--text2); font-size: 12px; }
.row.mono .val { font-family: var(--mono); font-size: 11.5px; color: var(--text2); }
body.compact .row { min-height: 25px; padding: 1px 10px; }
body.compact .row .tile { width: 18px; height: 18px; border-radius: 5px; }
body.compact .row .tile svg { width: 11px; height: 11px; }
.world-head { position: sticky; top: 0; z-index: 2; margin: 14px 0 4px; padding: 10px 14px; border-radius: 14px;
              display: flex; align-items: center; gap: 12px; }
.world-head:first-child { margin-top: 4px; }
.world-head .tile { width: 30px; height: 30px; border-radius: 9px; }
.world-head .tile svg { width: 18px; height: 18px; }
.world-head .name { font-size: 15px; font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.world-head .when { font: 11.5px var(--mono); color: var(--text2); }
.empty { height: 100%; display: grid; place-items: center; color: var(--text3); font-size: 14px; text-align: center; }
.jump { position: absolute; right: 26px; bottom: 22px; border: none; border-radius: 99px; padding: 7px 14px 7px 10px;
        color: var(--text); font: 600 12px var(--font); display: none; z-index: 3; align-items: center; gap: 6px; }
.jump svg { width: 14px; height: 14px; }
.jump.show { display: flex; }

/* ---------- Inspector ---------- */
.inspector { width: 250px; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
             transition: width .25s, opacity .2s, margin .25s; }
.inspector.hidden { width: 0; opacity: 0; margin-left: -10px; border-width: 0; }
.insp-head { padding: 18px 18px 8px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.insp-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.insp-head .count { color: var(--text2); font-size: 12px; }
.players { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
.player { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; white-space: nowrap; }
.player:hover { background: var(--hover); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff;
          font-weight: 700; font-size: 12px; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.player .pname { overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; flex: 1; }
.player .fr { color: var(--accent); flex-shrink: 0; }
.player .fr svg { width: 13px; height: 13px; }
.avatar { overflow: visible; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
.avatar img.frame-img { position: absolute; inset: 0; object-fit: contain; border-radius: 0; transform: scale(1.3); pointer-events: none; z-index: 1; }
.avatar.has-frame { background: transparent !important; }
.avatar.mini { width: 20px; height: 20px; font-size: 9px; }
body.compact .avatar.mini { width: 16px; height: 16px; font-size: 8px; }
.row .who { display: inline-flex; align-items: center; gap: 7px; vertical-align: middle; }
.status-dot { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--sheet); }

/* ---------- Profile card ---------- */
.pcard { width: min(420px, calc(100vw / var(--z, 1) - 40px)); border-radius: 24px; overflow: hidden; background: var(--sheet); backdrop-filter: blur(40px) saturate(180%);
         border: 1px solid var(--stroke); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 var(--stroke-in);
         transform: scale(.96) translateY(10px); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
.overlay.show .pcard { transform: none; }
.pcard-hero { height: 92px; background: linear-gradient(135deg, var(--accent), var(--purple)); position: relative; }
.pcard-hero .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(18px) saturate(140%); opacity: .8; transform: scale(1.3); }
.pcard .avatar.big { width: 92px; height: 92px; font-size: 34px; margin: -50px auto 0; border: 4px solid var(--sheet); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.pcard-body { padding: 10px 22px 20px; text-align: center; }
.pcard-body h3 { margin: 6px 0 2px; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
.pcard-status { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 12px; }
.pcard-status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.badge { display: inline-block; margin: 8px 3px 0; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600;
         background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.badge.gray { background: var(--track); color: var(--text2); }
.pcard-bio { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card); text-align: left; font-size: 12px;
             white-space: pre-wrap; max-height: 140px; overflow-y: auto; color: var(--text2); user-select: text; overflow-wrap: anywhere; }
.pcard-actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
.pcard-actions .btn { display: inline-flex; align-items: center; gap: 6px; }
.pcard-actions .btn svg { width: 13px; height: 13px; }
.pcard-note { font-size: 11px; color: var(--text3); margin-top: 10px; }

/* ---------- Login form ---------- */
.field { display: block; width: 100%; border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 10px;
         padding: 9px 12px; font: 13px var(--font); outline: none; user-select: text; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.form { padding: 14px; display: grid; gap: 10px; }
.form .btn { justify-self: stretch; padding: 9px; display: flex; align-items: center; justify-content: center; gap: 7px; }
.form .btn svg { width: 15px; height: 15px; flex: none; }
.btn-spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: btnspin .8s linear infinite; }
@keyframes btnspin { to { transform: rotate(360deg); } }
.form .err { color: var(--red); font-size: 12px; min-height: 16px; }
.form .note { color: var(--text2); font-size: 11.5px; display: flex; gap: 6px; align-items: flex-start; }
.form .note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }
.code-field { text-align: center; font: 600 22px var(--mono); letter-spacing: .35em; }
.btn:disabled { opacity: .5; }
.insp-foot { font-size: 11px; color: var(--text3); text-align: center; padding: 8px 12px 14px; white-space: nowrap; }

/* ---------- Settings sheet ---------- */
.overlay { position: fixed; top: 0; left: 0; width: calc(100vw / var(--z, 1)); height: calc(100vh / var(--z, 1)); z-index: 30; display: grid; place-items: center; background: rgba(0,0,0,.25);
           opacity: 0; pointer-events: none; transition: opacity .2s; }
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet { width: min(600px, calc(100% - 40px)); max-height: calc(100vh / var(--z, 1) - 60px); border-radius: 24px; display: flex; flex-direction: column;
         background: var(--sheet); backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--stroke);
         box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 var(--stroke-in);
         transform: scale(.96) translateY(10px); transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
.overlay.show .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; padding: 18px 20px 10px; gap: 10px; }
.sheet-head h1 { margin: 0; font-size: 20px; font-weight: 700; flex: 1; }
.btn { border: none; border-radius: 99px; padding: 6px 16px; font: 600 12.5px var(--font); color: var(--text);
       background: var(--track); white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: #fff; }
.sheet-body { overflow-y: auto; padding: 0 20px 22px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--text2); margin: 16px 6px 6px; }
.card { background: var(--card); border-radius: 14px; border: 1px solid var(--sep); overflow: hidden; }
.srow { display: flex; align-items: center; gap: 12px; padding: 9px 12px; min-height: 46px; }
.srow + .srow { border-top: 1px solid var(--sep); }
.srow .label { flex: 1; min-width: 0; }
.srow .hint { display: block; font-size: 11px; color: var(--text2); }
.themes { display: flex; gap: 14px; padding: 14px 12px 12px; justify-content: center; }
.theme-opt { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; border: none; background: none; color: var(--text); padding: 0; }
.theme-prev { width: 96px; height: 62px; border-radius: 10px; border: 3px solid transparent; position: relative; overflow: hidden;
              box-shadow: 0 0 0 1px var(--sep); }
.theme-opt.on .theme-prev { border-color: var(--accent); }
.theme-prev::before { content: ""; position: absolute; left: 8px; top: 8px; width: 26px; bottom: 8px; border-radius: 5px; background: var(--pw); }
.theme-prev::after { content: ""; position: absolute; left: 40px; right: 8px; top: 8px; bottom: 8px; border-radius: 5px; background: var(--pw); }
.prev-light { background: linear-gradient(135deg, #a1c4fd, #fbc2eb); --pw: rgba(255,255,255,.75); }
.prev-dark { background: linear-gradient(135deg, #1a2a6c, #b21f66); --pw: rgba(30,30,34,.7); }
.prev-auto { background: linear-gradient(135deg, #a1c4fd 0 50%, #1a2a6c 50%); --pw: rgba(128,128,136,.6); }
.dots { display: flex; gap: 8px; }
.dot { width: 20px; height: 20px; border-radius: 50%; border: none; padding: 0; background: var(--d); display: grid; place-items: center; color: #fff;
       box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.dot svg { width: 12px; height: 12px; stroke-width: 3.5; opacity: 0; }
.dot.on svg { opacity: 1; }
.swatches { display: flex; gap: 8px; }
.swatch { width: 44px; height: 30px; border-radius: 8px; border: 2px solid transparent; padding: 0; box-shadow: 0 0 0 1px var(--sep); }
.swatch.on { border-color: var(--accent); }
input[type=range] { appearance: none; width: 170px; height: 4px; border-radius: 99px; background: var(--track); outline: none; }
input[type=range]::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.1); }
.about { text-align: center; padding: 18px 12px; }
.about .app-icon { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 10px; display: grid; place-items: center; color: #fff;
                   background: linear-gradient(135deg, var(--accent), var(--purple)); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.about .app-icon svg { width: 30px; height: 30px; }
.about b { font-size: 15px; display: block; }
.about span { color: var(--text2); font-size: 12px; }

/* ---------- Navigation ---------- */
.nav { padding: 4px 10px 6px; display: grid; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; border: none; background: none;
            color: var(--text); font: 500 13px var(--font); text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.nav-item .label { flex: 1; }
.nav-badge { min-width: 20px; padding: 0 6px; height: 18px; border-radius: 99px; background: var(--track); color: var(--text2);
             font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.nav-badge.hot { background: var(--red); color: #fff; }
.nav-sep { height: 1px; background: var(--sep); margin: 4px 16px 2px; }
#filterArea { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.view { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 16px; }
.view.on { display: block; }
#log.view.on { display: block; }
.empty-state { display: grid; place-items: center; text-align: center; height: 100%; color: var(--text2); gap: 12px; align-content: center; }
.empty-state .tile { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto; }
.empty-state .tile svg { width: 26px; height: 26px; }

/* ---------- Friends ---------- */
.sec-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text2);
            margin: 14px 4px 8px; text-transform: none; }
.sec-head:first-child { margin-top: 4px; }
.sec-head .n { color: var(--text3); font-weight: 600; }
.sec-head button { margin-left: auto; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
.live.on i { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.fcard { display: flex; gap: 10px; padding: 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--sep); align-items: center; min-width: 0; }
.fcard:hover { background: var(--hover); }
.fcard .avatar { width: 40px; height: 40px; font-size: 15px; overflow: visible; }
.fcard .avatar img { border-radius: 50%; }
.fcard .info { flex: 1; min-width: 0; }
.fcard .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .sub { font-size: 11.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .loc { font-size: 11.5px; display: flex; gap: 5px; align-items: center; min-width: 0; margin-top: 1px; }
.fcard .loc svg { width: 12px; height: 12px; color: var(--text3); }
.fcard .loc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcard .acts { display: flex; gap: 4px; }
.mini-btn { width: 28px; height: 28px; border-radius: 99px; border: none; display: grid; place-items: center; background: var(--track); color: var(--text); }
.mini-btn:hover { background: var(--accent); color: #fff; }
.mini-btn svg { width: 14px; height: 14px; }
.itype { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 99px; background: var(--track); color: var(--text2); flex-shrink: 0; line-height: 16px; }
.avwrap { position: relative; flex-shrink: 0; display: block; }
.avwrap .sdot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--sheet); }
.pcard { max-height: calc(100vh / var(--z, 1) - 40px); overflow-y: auto; }

/* ---------- Feed / Notifications / History ---------- */
.frow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; }
.frow:hover { background: var(--hover); }
.frow .time { font: 11.5px var(--mono); color: var(--text3); flex-shrink: 0; width: 92px; }
.frow .avatar { width: 26px; height: 26px; font-size: 11px; }
.frow .nm { font-weight: 600; cursor: pointer; flex-shrink: 0; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .what { flex: 1; min-width: 0; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.frow .what svg { width: 13px; height: 13px; flex-shrink: 0; }
.frow .what span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { color: var(--accent); cursor: pointer; }
.link:hover { text-decoration: underline; }
.ncard { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--sep); margin-bottom: 8px; }
.ncard .avatar { width: 40px; height: 40px; font-size: 15px; }
.ncard .info { flex: 1; min-width: 0; }
.ncard .nm { font-weight: 600; }
.ncard .sub { color: var(--text2); font-size: 12px; }
.ncard .acts { display: flex; gap: 6px; }
.hrow { border-radius: 14px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--sep); overflow: hidden; }
.hhead { display: flex; align-items: center; gap: 12px; padding: 8px 10px; cursor: pointer; }
.hhead:hover { background: var(--hover); }
.thumb { width: 64px; height: 42px; border-radius: 8px; background: var(--track); background-size: cover; background-position: center; flex-shrink: 0;
         display: grid; place-items: center; color: var(--text3); }
.thumb svg { width: 18px; height: 18px; }
.hhead .info { flex: 1; min-width: 0; }
.hhead .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hhead .sub { color: var(--text2); font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.hhead .chev { color: var(--text3); transition: transform .2s; }
.hrow.open .chev { transform: rotate(90deg); }
.hbody { padding: 4px 12px 12px 86px; display: none; }
.hrow.open .hbody { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 99px; background: var(--track); font-size: 12px; cursor: pointer; max-width: 200px; }
.chip:hover { background: var(--hover); }
.chip .avatar { width: 20px; height: 20px; font-size: 9px; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Search ---------- */
.search-head { display: flex; gap: 10px; align-items: center; margin: 4px 0 14px; }
.search-head .field { flex: 1; border-radius: 99px; padding: 9px 16px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.wcard { border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--sep); cursor: pointer; }
.wcard:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.wcard .wimg { aspect-ratio: 4 / 3; background: var(--track); background-size: cover; background-position: center; }
.wcard .winfo { padding: 8px 10px; }
.wcard .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wcard .sub { color: var(--text2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- World card / profile extras ---------- */
.wc-hero { height: 190px; background: var(--track); background-size: cover; background-position: center; }
.stats { display: flex; justify-content: center; gap: 16px; margin-top: 8px; color: var(--text2); font-size: 12px; flex-wrap: wrap; }
.stats b { color: var(--text); }
.pcard-section { margin-top: 12px; text-align: left; }
.pcard-section .lbl { font-size: 11px; font-weight: 700; color: var(--text3); margin: 0 2px 4px; }
.memo { width: 100%; min-height: 54px; resize: vertical; border-radius: 10px; border: 1px solid var(--sep); background: var(--card); color: var(--text);
        font: 12px var(--font); padding: 8px 10px; outline: none; user-select: text; }
.memo:focus { border-color: var(--accent); }
.locline { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--card); font-size: 12px; }
.locline .w { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.locline .w.wrap { white-space: normal; }
.acts { display: flex; gap: 4px; flex-shrink: 0; }
.world-head { cursor: pointer; }
.pcard.wide { width: 420px; }

/* ---------- Banner / frame / badge ---------- */
.fcard.bnr { position: relative; overflow: hidden; border-color: transparent; color: #fff; }
.fcard.bnr .bnr-bg { position: absolute; inset: 0; background-size: cover !important; background-position: center !important; z-index: 0; }
.fcard.bnr::after { content: ""; position: absolute; inset: 0; z-index: 0;
                    background: linear-gradient(90deg, rgba(0,0,0,.66) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,.2) 100%); }
.fcard.bnr > *:not(.bnr-bg) { position: relative; z-index: 1; }
.fcard.bnr:hover::after { background: linear-gradient(90deg, rgba(0,0,0,.58) 0%, rgba(0,0,0,.32) 55%, rgba(0,0,0,.1) 100%); }
.fcard.bnr .nm { font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
.fcard.bnr .sub, .fcard.bnr .loc { color: rgba(255,255,255,.85); }
.fcard.bnr .loc svg { color: rgba(255,255,255,.65); }
.fcard.bnr .itype { background: rgba(255,255,255,.22); color: #fff; }
.fcard.bnr .mini-btn { background: rgba(255,255,255,.22); color: #fff; backdrop-filter: blur(8px); }
.fcard.bnr .mini-btn:hover { background: var(--accent); }
.fcard.bnr .avwrap .sdot { border-color: rgba(0,0,0,.55); }
.avatar.framed { box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 4.5px var(--ring, var(--accent)), 0 2px 8px rgba(0,0,0,.35); }
.avatar.mini.framed, .chip .avatar.framed { box-shadow: 0 0 0 1.5px var(--ring, var(--accent)); }
.pcard-hero.cover { height: 120px; background-size: cover; background-position: center; }
.badge.rank { background: color-mix(in srgb, var(--rk) 20%, transparent); color: var(--rk); }
.badge.vplus { background: linear-gradient(135deg, #ffcb47, #ff7a59); color: #fff; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
.badges img { width: 36px; height: 36px; border-radius: 9px; object-fit: contain; background: var(--card); padding: 2px; }
.links { display: grid; gap: 6px; }
.link-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: var(--card); font-size: 12px; cursor: pointer; min-width: 0; }
.link-row:hover { background: var(--hover); color: var(--accent); }
.link-row svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--text3); }
.link-row b { flex-shrink: 0; }
.link-row span { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.lang { padding: 3px 10px; cursor: default; }

/* ---------- Groups / avatars / inventory ---------- */
.gcard { position: relative; }
.gcard .wimg { aspect-ratio: 3 / 1; }
.gcard .gicon { position: absolute; left: 10px; top: 0; margin-top: calc(33.3% - 24px); }
.gicon { width: 44px; height: 44px; border-radius: 12px; background: var(--track) center/cover; border: 3px solid var(--sheet);
         box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.gcard .winfo { padding-top: 26px; }
.gicon.big { width: 84px; height: 84px; border-radius: 20px; margin: -46px auto 0; border-width: 4px; position: relative; }
.verified svg { width: 15px; height: 15px; color: var(--blue); display: inline-block; vertical-align: -2px; }
.hint-inline { color: var(--text3); font-size: 11.5px; }
.wcard.current { outline: 2.5px solid var(--accent); outline-offset: -2.5px; }
.wcard .wimg { position: relative; }
.wear { position: absolute; left: 8px; top: 8px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.inv-tabs button { display: inline-flex; align-items: center; gap: 6px; }
.inv-tabs svg { width: 14px; height: 14px; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.igrid.photos { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.itile { position: relative; border-radius: 14px; background: var(--card); border: 1px solid var(--sep); padding: 8px; cursor: pointer; min-width: 0; }
.itile:hover { background: var(--hover); }
.itile.dim { opacity: .5; }
.itile.on { outline: 2.5px solid var(--accent); outline-offset: -2.5px; }
.iimg { aspect-ratio: 1; border-radius: 10px; background: var(--track) center/contain no-repeat; }
.photos .iimg { aspect-ratio: 16 / 9; background-size: cover; }
.iname { font-weight: 600; font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.isub { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itile .del { position: absolute; top: 12px; right: 12px; opacity: 0; transition: opacity .15s; }
.itile:hover .del, .itile .del.armed { opacity: 1; }
.mini-btn.armed, .btn.danger.armed { background: var(--red) !important; color: #fff; width: auto; padding: 0 10px; font: 600 11px var(--font); }
.ianim { position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700;
         padding: 1px 7px 1px 5px; border-radius: 99px; background: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.ianim svg { width: 9px; height: 9px; fill: currentColor; }
.itag { position: absolute; left: 12px; top: 12px; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.5); color: #fff; }

/* ---------- Animated emoji ---------- */
.sheet.wide { width: min(880px, calc(100% - 40px)); }
.emk { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; padding: 0 20px 20px; overflow-y: auto; }
.emk-left { display: flex; flex-direction: column; gap: 10px; }
.checker { background: repeating-conic-gradient(rgba(128,128,128,.22) 0 25%, transparent 0 50%) 0 0 / 20px 20px, var(--track); }
.emk canvas { width: 300px; height: 300px; border-radius: 16px; display: block; }
.emk canvas.pv { cursor: crosshair; }
.emk canvas.sh { border-radius: 10px; }
.emk-drop { height: 300px; border: 2px dashed var(--sep); border-radius: 16px; display: grid; place-content: center; justify-items: center; gap: 8px;
            text-align: center; color: var(--text2); cursor: pointer; padding: 20px; white-space: pre-line; }
.emk-drop:hover, .emk-drop.over { border-color: var(--accent); color: var(--text); }
.emk-drop svg { width: 30px; height: 30px; }
.emk .srow input[type=range] { width: 150px; }
.emk .val { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text2); }
.emk .card + .card { margin-top: 10px; }
.emk-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.emk-actions .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; }
.emk-actions .btn svg { width: 15px; height: 15px; }
.emk select { border: none; border-radius: 8px; background: var(--track); color: var(--text); font: 500 12px var(--font); padding: 5px 8px; }
.emk select option { background: var(--sheet); color: var(--text); }
.emk input[type=color] { width: 34px; height: 24px; border: none; padding: 0; background: none; border-radius: 6px; }
.btn.sm { padding: 3px 10px; font-size: 11.5px; }
.btn.on { background: var(--accent); color: #fff; }
@media (max-width: 820px) { .emk { grid-template-columns: 1fr; } .emk-left { align-items: center; } }

/* ---------- misc ---------- */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; z-index: 40;
         padding: 9px 18px; border-radius: 99px; font-weight: 500; transition: all .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.grip { position: fixed; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 20; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--track); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--text3); }
::-webkit-scrollbar-track { background: transparent; }
button { cursor: default; }
</style>

<body>
<div class="wallpaper"></div>
<div class="app">
  <aside class="sidebar glass">
    <div class="traffic pywebview-drag-region">
      <button class="tl close" data-tip="close" onclick="api('close')" data-icon="x"></button>

</div>

<script>
// Lucide icons (ISC) — vrclog_mac.py injects vrclog_icons.json in place of this line

const DIM = new Set(["instance", "travel", "world_load", "download", "mic", "moderation", "pickup", "avatar_load"]);

// ---------- Languages ----------

    pause: "หยุดชั่วคราว", resume: "ทำต่อ", clear: "ล้างจอ", folder: "เปิดโฟลเดอร์ log", settings: "ตั้งค่า",
    togglePlayers: "แสดง/ซ่อนผู้เล่น", close: "ปิด", min: "ย่อ", zoom: "ขยาย",

    compact: "แถวแบบกะทัดรัด", compactHint: "แสดงได้หลายบรรทัดขึ้นในหน้าจอเดียว",
    onTop: "อยู่บนสุดเสมอ", onTopHint: "หน้าต่างลอยอยู่เหนือโปรแกรมอื่น",

  window.applyFont?.();
  root.dataset.theme = d ? "dark" : "light";
  root.style.setProperty("--accent", ACCENTS[S.accent] || ACCENTS.blue);
  const wp = (WALLPAPERS[S.wallpaper] || WALLPAPERS.tahoe)[d ? 0 : 1];
  ["--wall-1", "--wall-2", "--wall-3", "--wall-4", "--wall-base"].forEach((v, i) => root.style.setProperty(v, wp[i]));
  root.style.setProperty("--glass-a", (0.12 + S.glass / 100 * 0.75).toFixed(3));
  root.style.setProperty("--z", SIZES[S.size] || 1);
  document.body.classList.toggle("compact", !!S.compact);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyAppearance(); if (settingsOpen) buildSettings(); });

function applyLang() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-tip]").forEach(el => el.title = t(el.dataset.tip));
  $("pauseBtn").title = t(paused ? "resume" : "pause");
  $("search").placeholder = t("searchPh");
  buildNav();
  buildSidebar();
  render();
  if (lastBatch) { lastPlayers = ""; renderPlayers(lastBatch.players); }
  renderView();
  updateSubtitle();
}

// ---------- Startup ----------
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = icon(el.dataset.icon));

window.addEventListener("pywebviewready", async () => {
  const init = await api("init");
  VERSION = init.version;
  S = { ...DEFAULTS, ...(init.settings || {}) };
  init.kinds.forEach(k => KINDS[k.name] = k);
  for (const k of init.kinds) enabled[k.name] = S.enabled?.[k.name] ?? k.default;
  for (const k of FEED_TYPES) feedOn[k] = S.feedEnabled?.[k] ?? true;
  view = VIEWS.includes(S.view) ? S.view : "friends";
  applyAppearance();
  toggleInspector(S.inspector !== false, false);
  if (S.onTop) api("set_on_top", true);
  ready = true;
  setView(view, false);
  applyLang();
  queued.forEach(b => window.onBatch(b));
  queued = [];
  feed = (await api("feed")) || [];
  if (view === "feed") renderView();
});

function kindLabel(n) { return L().kinds?.[n] || KINDS[n]?.desc || n; }

function buildSidebar() {
  const root = $("groups");
  root.innerHTML = "";
  $("filterArea").style.display = view === "log" || view === "feed" ? "" : "none";
  $("filterFooter").style.display = view === "log" ? "" : "none";
  $("filterTitle").textContent = t("chooseView");
  if (view === "feed") return buildFeedFilters(root);
  const listed = new Set(GROUPS.flatMap(g => g[1]));
  const extra = Object.keys(KINDS).filter(k => !listed.has(k));  // In case new types are added in vrclog.py
  for (const [title, names] of [...GROUPS, ...(extra.length ? [["g_other", extra]] : [])]) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-title">${t(title)}</div>`;
    for (const n of names) {
      if (!KINDS[n]) continue;
      const [ic, col] = KIND_STYLE[n] || ["circle-alert", "gray"];
      const row = document.createElement("label");
      row.className = "toggle-row";
      row.innerHTML = `<span class="tile" style="--c:var(--${col})">${icon(ic)}</span><span class="label"></span>
                       <span class="switch"><input type="checkbox"></span>`;
      row.querySelector(".label").textContent = row.title = kindLabel(n);
      const cb = row.querySelector("input");
      cb.checked = enabled[n];
      cb.dataset.kind = n;
      cb.onchange = () => { enabled[n] = cb.checked; save(); render(); };
      g.appendChild(row);
    }
    root.appendChild(g);
  }
}

function syncSwitches() { document.querySelectorAll("#groups input").forEach(cb => cb.checked = enabled[cb.dataset.kind]); }
function setAll(v) { for (const n in enabled) enabled[n] = v; syncSwitches(); save(); render(); }
function setDefault() { for (const n in enabled) enabled[n] = KINDS[n].default; syncSwitches(); save(); render(); }

// ---------- Data from Python ----------
window.onBatch = (b) => {
  if (!ready) { queued.push(b); return; }
  lastBatch = b;
  if (view === "log") $("world").textContent = b.world && b.world !== "-" ? b.world : "VRC Nook";
  renderPlayers(b.players);
  for (const e of b.events) {  // Attach the instance to the world header so the world info can be opened
    if (e.k === "world") lastWorldEv = e;
    else if (e.k === "instance" && lastWorldEv && !lastWorldEv.loc) lastWorldEv.loc = e.v;
  }
  if (b.events.length) {
    events.push(...b.events);
    if (events.length > MAX_EVENTS) events.splice(0, events.length - MAX_EVENTS);
    if (!paused) appendRows(b.events);
  }
  updateSubtitle();
};
function updateSubtitle() {
  if (view !== "log") return updateViewTitle();
  $("subtitle").textContent = t("events", events.length) + (paused ? ` · ${t("paused")}` : "");
}

// ---------- Rendering ----------
function text(e) {
  const f = L().fmt[e.k];
  try { return f ? f(...(e.p || [])) : e.v; } catch { return e.v; }
}
function visible(e) {
  if (!enabled[e.k]) return false;
  return !query || text(e).toLowerCase().includes(query) || e.v.toLowerCase().includes(query) || e.u.toLowerCase().includes(query);
}
function timeStr(ts) {
  const [, , mo, d, hms] = ts.match(/^(\d{4})\.(\d\d)\.(\d\d) (.+)$/) || [];
  return S.showDate ? `${d}/${mo} ${hms}` : hms;
}

function makeRow(e) {
  const [ic, col] = KIND_STYLE[e.k] || ["circle-alert", "gray"];
  const color = `var(--${col})`;
  if (e.k === "world") {
    const d = document.createElement("div");
    d.className = "world-head glass";
    d.innerHTML = `<span class="tile" style="--c:${color}">${icon(ic)}</span><span class="name"></span><span class="when"></span>`;
    d.querySelector(".name").textContent = e.v;
    d.querySelector(".when").textContent = e.t.replace(/^(\d{4})\.(\d\d)\.(\d\d) /, "$3/$2 ");
    d.onclick = () => e.loc && openWorld(e.loc.split(":")[0], e.loc);
    return d;
  }
  const d = document.createElement("div");
  d.className = "row" + (e.k === "instance" ? " mono" : DIM.has(e.k) ? " dim" : "");
  d.innerHTML = `<span class="time"></span><span class="tile" style="--c:${color}">${icon(ic)}</span><span class="val"></span>`;
  d.querySelector(".time").textContent = timeStr(e.t);
  d.querySelector(".time").title = e.t;
  d.querySelector(".tile").title = kindLabel(e.k);
  const val = d.querySelector(".val");
  val.textContent = text(e);
  if (e.k === "join" || e.k === "leave") {
    val.style.color = color;
    if (S.showPics && e.u) {
      val.textContent = "";
      const who = document.createElement("span");
      who.className = "who";
      who.append(makeAvatar(e.u, e.p?.[0] || e.v, "mini"), document.createTextNode(text(e)));
      who.style.cursor = "pointer";
      who.onclick = () => showProfile(e.u, e.p?.[0] || e.v);
      val.appendChild(who);
    }
    const p = document.createElement("span");
    p.className = "pill";
    p.textContent = t("people", e.c);
    d.appendChild(p);
  }
  if (e.k === "instance") {
    val.classList.add("link");
    val.onclick = () => openWorld(e.v.split(":")[0], e.v);
  }
  if (e.u) d.title = e.u;
  return d;
}

function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60; }
function scrollBottom() { logEl.scrollTop = logEl.scrollHeight; $("jump").classList.remove("show"); }
logEl.addEventListener("scroll", () => { if (atBottom()) $("jump").classList.remove("show"); });

function appendRows(list) {
  const stick = atBottom();
  const frag = document.createDocumentFragment();
  for (const e of list) if (visible(e)) frag.appendChild(makeRow(e));
  if (!frag.childNodes.length) return;
  logEl.querySelector(".empty")?.remove();
  logEl.appendChild(frag);
  while (logEl.childElementCount > MAX_ROWS) logEl.firstElementChild.remove();
  if (stick) scrollBottom(); else $("jump").classList.add("show");
}

function render() {
  logEl.innerHTML = "";
  const shown = [];
  for (let i = events.length - 1; i >= 0 && shown.length < MAX_ROWS; i--) if (visible(events[i])) shown.push(events[i]);
  shown.reverse();
  if (!shown.length) {
    logEl.innerHTML = `<div class="empty">${t(events.length ? "noMatch" : "waiting")}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  shown.forEach(e => frag.appendChild(makeRow(e)));
  logEl.appendChild(frag);
  scrollBottom();
}

// ---------- Players ----------
const AV_COLORS = ["blue", "green", "orange", "purple", "pink", "teal", "indigo", "red", "mint", "brown"];
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) | 0; return Math.abs(h); }
// ---------- Profile pictures / VRChat account ----------
const PROFILES = {};  // uid -> {img, displayName, status, bio, ...}
let AUTH = { loggedIn: false }, authKnown = false;

// Build the profile picture circle — shows the first letter until the image loads, then swaps itself
function makeAvatar(uid, name, cls = "") {
  const av = document.createElement("span");
  av.className = "avatar " + cls;
  av.dataset.av = uid;
  av.dataset.name = name;
  fillAvatar(av);
  return av;
}
function fillAvatar(av) {
  const p = PROFILES[av.dataset.av];
  av.innerHTML = "";
  // Profile frame: use the real frame image from the template once loaded; meanwhile show a theme-colored ring
  const fr = p?.iconFrame;
  const fimg = fr && ((S.animFrames && FRAMES[fr]?.anim) || FRAMES[fr]?.img);
  if (fr && !(S.animFrames ? FRAMES[fr]?.anim : FRAMES[fr]?.img)) needFrame(fr);
  av.classList.toggle("framed", !!fr && !fimg);
  av.classList.toggle("has-frame", !!fimg);
  const ring = [p?.themeIconColor, p?.themeButtonColor, p?.bannerColor].find(c => c && HEX.test(c) && c !== "000000");
  if (ring) av.style.setProperty("--ring", "#" + ring); else av.style.removeProperty("--ring");
  if (p?.img) {
    const img = new Image();
    img.src = p.img;
    img.draggable = false;
    av.appendChild(img);
    av.style.background = "var(--track)";
  } else {
    av.style.background = `var(--${AV_COLORS[hash(av.dataset.av) % AV_COLORS.length]})`;
    av.textContent = [...(av.dataset.name || "?").trim()][0]?.toUpperCase() || "?";
  }
  if (fimg) {  // Overlay the frame on the picture at 130%, like the VRChat website
    const f = new Image();
    f.className = "frame-img";
    f.src = fimg;
    f.draggable = false;
    av.appendChild(f);
  }
}

// ---------- Profile frames ----------
const FRAMES = {};  // template ID -> {img: still image, anim: animated WebP}
const frameAsked = { static: new Set(), anim: new Set() };
let framePending = new Set(), frameTimer = 0;
function needFrame(tid) {
  const asked = frameAsked[S.animFrames ? "anim" : "static"];
  if (asked.has(tid)) return;
  asked.add(tid);
  framePending.add(tid);
  clearTimeout(frameTimer);
  frameTimer = setTimeout(() => { api("frames", [...framePending], !!S.animFrames); framePending = new Set(); }, 300);
}
window.onFrames = ({ anim, list }) => {
  const ids = new Set();
  for (const f of list) {
    if (!f.img) continue;
    FRAMES[f.id] = { ...FRAMES[f.id], [anim ? "anim" : "img"]: f.img };
    ids.add(f.id);
  }
  if (!ids.size) return;
  document.querySelectorAll(".avatar[data-av]").forEach(av => { if (ids.has(PROFILES[av.dataset.av]?.iconFrame)) fillAvatar(av); });
};

window.onProfiles = (list) => {
  for (const p of list) {
    PROFILES[p.id] = p;
    document.querySelectorAll(`[data-av="${CSS.escape(p.id)}"]`).forEach(fillAvatar);
    if (profileOpen === p.id) buildProfile();
  }
  if (lastBatch) { lastPlayers = ""; renderPlayers(lastBatch.players); }
};

window.onAuth = (a) => {
  const wasIn = AUTH.loggedIn;
  AUTH = a;
  authKnown = true;
  if (!ready) return;
  if (a.expired && wasIn) toast(t("sessionExpired"));
  if (settingsOpen && settingsView === "main") buildSettings();
  renderView();
};

let lastPlayers = "";
function renderPlayers(list) {
  const key = JSON.stringify(list);
  if (key === lastPlayers) return;
  lastPlayers = key;
  $("pcount").textContent = t("people", list.length);
  const root = $("players");
  root.innerHTML = "";
  for (const [uid, name] of list) {
    const d = document.createElement("div");
    d.className = "player";
    d.title = uid;
    d.innerHTML = `<span class="pname"></span>`;
    d.prepend(makeAvatar(uid, name));
    d.querySelector(".pname").textContent = name;
    if (PROFILES[uid]?.isFriend) d.insertAdjacentHTML("beforeend", `<span class="fr" title="${t("friend")}">${icon("heart")}</span>`);
    d.onclick = () => showProfile(uid, name);
    root.appendChild(d);
  }
}

// ---------- Profile card ----------
let profileOpen = null, profileName = "";
const PEXTRA = {};  // uid -> {enc, memo, friend} from the local database
async function showProfile(uid, name) {
  worldOpen = null; groupOpen = null; avatarOpen = null; profileOpen = uid; profileName = name || PROFILES[uid]?.displayName || uid;
  buildProfile(); $("pOverlay").classList.add("show");
  const x = await api("user", uid);
  if (x) { PEXTRA[uid] = x; if (profileOpen === uid) buildProfile(); }
}
function closeProfile() { profileOpen = null; worldOpen = null; groupOpen = null; avatarOpen = null; $("pOverlay").classList.remove("show"); }

function profileExtras(uid) {
  const x = PEXTRA[uid];
  if (!x) return "";
  const f = FRIENDS[uid] || x.friend || {};
  let html = "";
  if (f.state && f.state !== "offline") {
    const loc = f.location || "";
    const L2 = parseLoc(loc), w = WORLDS[L2.wid];
    html += `<div class="pcard-section"><div class="lbl">${t("location")}</div><div class="locline">${icon("map-pin")}
      <span class="w">${L2.wid ? `<span class="link" onclick="openWorld('${L2.wid}','${esc(loc)}')">${esc(w?.name || L2.wid)}</span>` : esc(locLabel(loc, f.state))}</span>
      ${L2.wid ? `<span class="itype">${esc(itypeLabel(L2))}</span>${joinButtons(loc)}` : ""}</div></div>`;
  }
  const prev = (x.names || []).filter(n => n.name !== (PROFILES[uid]?.displayName || profileName));
  if (prev.length) html += `<div class="pcard-section"><div class="lbl">${t("prevNames")}</div><div class="links">${[...prev].reverse().map(n =>
    `<div class="link-row" style="cursor:default">${icon("pencil")}<span style="color:var(--text)">${esc(n.name)}</span><span style="margin-left:auto;flex-shrink:0">${fmtDate(n.first).slice(0, 10)}${n.last && n.last.slice(0, 10) !== n.first.slice(0, 10) ? " – " + fmtDate(n.last).slice(0, 10) : ""}</span></div>`).join("")}</div></div>`;
  const e = x.enc || {};
  if (uid !== AUTH.id) html += `<div class="pcard-section"><div class="lbl">${t("encounters")}</div><div class="locline">${icon("history")}<span class="w wrap">${
    e.count ? t("met", e.count, fmtDate(e.first), fmtDate(e.last)) : t("neverMet")}</span></div></div>`;
  if (uid !== AUTH.id) html += `<div class="pcard-section"><div class="lbl">${t("memo")}</div>
    <textarea class="memo" placeholder="${t("memoPh")}" onchange="api('set_memo','${uid}',this.value);PEXTRA['${uid}'].memo=this.value">${esc(x.memo)}</textarea></div>`;
  return html;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function buildProfile() {
  const uid = profileOpen, p = PROFILES[uid] || {};
  const name = p.displayName || profileName;
  const st = (p.status || "").toLowerCase();
  const card = $("pcard");
  const memoFocused = document.activeElement?.classList.contains("memo");
  if (memoFocused) return;  // Don't overwrite while a note is being typed
  card.classList.remove("wide");
  const rank = trustRank(p);
  const isFriend = p.isFriend || !!FRIENDS[uid];
  const platform = p.last_platform || FRIENDS[uid]?.last_platform;
  card.innerHTML = `
    <div class="pcard-hero cover" style="${bannerStyle(uid)}">${!bannerStyle(uid) && p.img ? `<div class="bgimg" style="background-image:url('${p.img}')"></div>` : ""}</div>
    <div class="pcard-body">
      <div id="pcAv"></div>
      <h3>${esc(name)}</h3>
      ${st ? `<div class="pcard-status"><i style="background:${STATUS_COLOR[st] || "var(--gray)"}"></i>${esc(p.statusDescription || L().st?.[st] || st)}</div>` : ""}
      <div>
        ${rank ? `<span class="badge rank" style="--rk:${rank.color}">${rank.name}</span>` : ""}
        ${p.hasVrcPlus || (p.tags || []).includes("system_supporter") ? `<span class="badge vplus">VRC+</span>` : ""}
        ${isFriend ? `<span class="badge">${t("friend")}</span>` : ""}
        ${p.ageVerificationStatus === "18+" ? `<span class="badge gray">18+</span>` : ""}
        ${p.pronouns ? `<span class="badge gray">${esc(p.pronouns)}</span>` : ""}
        ${platform ? `<span class="badge gray">${esc(platform === "standalonewindows" ? "PC" : platform === "android" ? "Quest/Android" : platform === "ios" ? "iOS" : platform)}</span>` : ""}
      </div>
      ${badgesHtml(p)}
      ${p.displayName ? `<div class="pcard-bio">${esc(p.bio) || `<i>${t("noBio")}</i>`}</div>`
        : `<div class="pcard-note">${AUTH.loggedIn ? t("loadingProfile") : t("loginToSee")}</div>`}
      ${linksHtml(p)}
      ${langsHtml(p)}
      ${profileExtras(uid)}
      <div class="pcard-actions">
        <button class="btn" onclick="api('copy','${uid}');toast(t('copied', profileName))">${icon("copy")}${t("copyId")}</button>
        <button class="btn primary" onclick="api('open_profile','${uid}')">${icon("external-link")}${t("openWeb")}</button>
      </div>
      <div class="pcard-note" style="font-family:var(--mono)">${esc(uid)}</div>
    </div>`;
  const av = makeAvatar(uid, name, "big");
  $("pcAv").replaceWith(av);
}

// ---------- Banner / frame / badges / links ----------
const BANNERS = {};  // uid -> {img, bannerType, bannerColor}
window.onBanners = (list) => {
  for (const b of list) BANNERS[b.id] = b;
  if (view === "friends") renderView();
  if (profileOpen && list.some(b => b.id === profileOpen)) buildProfile();
};
const HEX = /^[0-9a-f]{6}$/i;
function bannerStyle(uid) {
  const b = BANNERS[uid] || {}, p = PROFILES[uid] || {};
  if (b.img) return `background-image:url('${b.img}')`;
  const c = b.bannerColor || p.bannerColor;
  return c && HEX.test(c) ? `background:linear-gradient(135deg,#${c},color-mix(in srgb,#${c} 55%,#000))` : "";
}
// VRChat trust ranks (colors as in game)
const RANKS = [["system_trust_veteran", "Trusted User", "#8143e6"], ["system_trust_trusted", "Known User", "#ff7b42"],
               ["system_trust_known", "User", "#2bcf5c"], ["system_trust_basic", "New User", "#1778ff"]];
function trustRank(p) {
  const tags = [...(p.trustTags || []), ...(p.tags || [])];
  if (!tags.length) return null;
  const r = RANKS.find(([tag]) => tags.includes(tag));
  return r ? { name: r[1], color: r[2] } : { name: "Visitor", color: "#8e8e93" };
}
function badgesHtml(p) {
  const list = (p.badges || []).filter(b => !b.hidden && b.badgeImageUrl?.startsWith("https://assets.vrchat.com/"));
  if (!list.length) return "";
  return `<div class="badges">${list.map(b => `<img src="${esc(b.badgeImageUrl)}" title="${esc(b.badgeName)}${b.badgeDescription ? " — " + esc(b.badgeDescription) : ""}" draggable="false">`).join("")}</div>`;
}
const LINK_NAMES = { "discord.com": "Discord", "discord.gg": "Discord", "x.com": "X", "twitter.com": "X", "youtube.com": "YouTube",
  "youtu.be": "YouTube", "twitch.tv": "Twitch", "steamcommunity.com": "Steam", "instagram.com": "Instagram", "tiktok.com": "TikTok",
  "booth.pm": "BOOTH", "github.com": "GitHub", "facebook.com": "Facebook", "bsky.app": "Bluesky", "pixiv.net": "pixiv", "ko-fi.com": "Ko-fi" };
function linksHtml(p) {
  const links = (p.bioLinks || []).filter(u => /^https?:\/\//.test(u));
  if (!links.length) return "";
  return `<div class="pcard-section"><div class="lbl">${t("links")}</div><div class="links">${links.map(u => {
    let host = u, path = "";
    try { const x = new URL(u); host = x.hostname.replace(/^www\.|^m\./, ""); path = decodeURIComponent(x.pathname + x.search).replace(/\/$/, ""); } catch {}
    const brand = Object.entries(LINK_NAMES).find(([d]) => host === d || host.endsWith("." + d))?.[1];
    return `<div class="link-row" title="${esc(u)}" onclick="api('open_url','${esc(u).replace(/'/g, "%27")}')">${icon("external-link")}
      <b>${esc(brand || host)}</b><span>${esc(path)}</span></div>`;
  }).join("")}</div></div>`;
}
const LANG3 = { tha: "th", eng: "en", jpn: "ja", kor: "ko", zho: "zh", spa: "es", fra: "fr", deu: "de", rus: "ru", por: "pt", ita: "it",
                vie: "vi", ind: "id", msa: "ms", fil: "fil", nld: "nl", pol: "pl", tur: "tr", ara: "ar", hin: "hi", ukr: "uk", swe: "sv" };
function langsHtml(p) {
  const langs = p.languages || (p.tags || []).filter(x => x.startsWith("language_")).map(x => x.slice(9));
  if (!langs.length) return "";
  let dn = null;
  try { dn = new Intl.DisplayNames([S.lang], { type: "language" }); } catch {}
  const name = c => { try { return dn?.of(LANG3[c] || c) || c; } catch { return c; } };
  return `<div class="pcard-section"><div class="lbl">${t("languages")}</div><div class="chips">${langs.map(c => `<span class="chip lang">${esc(name(c))}</span>`).join("")}</div></div>`;
}

// ================= VRCX-style pages =================
const VIEWS = ["log", "friends", "feed", "notifs", "history", "groups", "avatars", "inventory", "search"];
const NAV = { log: ["scroll-text", "blue"], friends: ["users-round", "green"], feed: ["activity", "orange"],
              notifs: ["bell", "red"], history: ["history", "purple"], groups: ["users", "teal"], avatars: ["shirt", "indigo"],
              inventory: ["package", "brown"], search: ["search", "gray"] };
const FEED_TYPES = ["online", "offline", "location", "status", "name", "avatar", "bio", "friendAdd", "friendRemove"];
const FEED_STYLE = { online: ["user-check", "green"], offline: ["user-x", "gray"], location: ["map-pin", "blue"],
  status: ["radio", "orange"], name: ["pencil", "pink"], avatar: ["shirt", "indigo"], bio: ["notebook-pen", "teal"], friendAdd: ["user-plus", "pink"],
  friendRemove: ["user-minus", "red"] };
const ITYPE = { public: "Public", "friends+": "Friends+", friends: "Friends", "invite+": "Invite+", invite: "Invite",
                group: "Group", groupPublic: "Group Public", "group+": "Group+" };
let view = "log", feed = [], feedOn = {}, lastWorldEv = null;
const FRIENDS = {}, WORLDS = {};
let friendsLoaded = false, pipelineOn = false, NOTIFS = [];
let historyData = null, histOpen = new Set(), histPlayers = {};
let searchKind = "users", searchRes = null, searching = false;
let worldOpen = null, worldLoc = "";

function buildNav() {
  const online = Object.values(FRIENDS).filter(f => f.state === "online").length;
  $("nav").innerHTML = VIEWS.map(v => {
    const badge = v === "friends" && online ? `<span class="nav-badge">${online}</span>`
      : v === "notifs" && NOTIFS.length ? `<span class="nav-badge hot">${NOTIFS.length}</span>` : "";
    return `<button class="nav-item ${view === v ? "on" : ""}" onclick="setView('${v}')"><span class="tile" style="--c:var(--${NAV[v][1]})">${icon(NAV[v][0])}</span>
            <span class="label">${t("nav_" + v)}</span>${badge}</button>`;
  }).join("");
}

function setView(v, persist = true) {
  view = v;
  document.querySelectorAll(".content .view").forEach(el => el.classList.toggle("on", el.id === (v === "log" ? "log" : "v_" + v)));
  $("pauseBtn").style.display = $("clearBtn").style.display = v === "log" ? "" : "none";
  $("refreshBtn").style.display = ["friends", "history", "notifs", "groups", "avatars", "inventory"].includes(v) || VIEW_REFRESH[v] ? "" : "none";
  $("searchBox").style.display = v === "search" ? "none" : "";
  $("jump").classList.remove("show");
  if (persist) { S.view = v; save(); }
  if (v === "history") loadHistory();
  buildNav(); buildSidebar(); renderView(); updateSubtitle();
  if (v === "log") { $("world").textContent = lastBatch?.world && lastBatch.world !== "-" ? lastBatch.world : "VRC Nook"; scrollBottom(); }
  if (v === "search") setTimeout(() => $("sq")?.focus(), 50);
}

function updateViewTitle() {
  $("world").textContent = t("nav_" + view);
  const online = Object.values(FRIENDS).filter(f => f.state === "online").length;
  $("subtitle").textContent = {
    friends: AUTH.loggedIn && friendsLoaded ? t("friendsCount", online, Object.keys(FRIENDS).length) : "",
    feed: t("events", feed.length), notifs: t("notifCount", NOTIFS.length),
    history: historyData ? t("visits", historyData.length) : "",
  }[view] || "";
}

// Pages added by vrclog_more.js register here (page name -> render function / reload function)
const VIEW_RENDER = {}, VIEW_REFRESH = {};
let renderTimer = 0;
function renderView() {
  if (!ready || view === "log") return;
  cancelAnimationFrame(renderTimer);
  renderTimer = requestAnimationFrame(() => {
    (VIEW_RENDER[view] || window["render" + view[0].toUpperCase() + view.slice(1)])?.();
    updateSubtitle();
  });
}
function refreshView() {
  if (view === "history") loadHistory();
  else if (view === "groups") { GRP.results = null; loadGroups(true); }
  else if (view === "avatars") loadAvatars(AVA.tab, true);
  else if (view === "inventory") loadInv(INV.tab, true);
  else if (VIEW_REFRESH[view]) VIEW_REFRESH[view]();
  else api("friends_reload");
  toast(t("refreshing"));
}
function needLogin(el) {
  el.innerHTML = `<div class="empty-state"><span class="tile" style="--c:var(--gray)">${icon("lock")}</span><div>${t("needLogin")}</div>
    <div><button class="btn primary" onclick="openSettings('login')">${t("signIn")}</button></div></div>`;
}
function emptyState(el, ic, msg) {
  el.innerHTML = `<div class="empty-state"><span class="tile" style="--c:var(--gray)">${icon(ic)}</span><div>${msg}</div></div>`;
}

// ---------- Location / time ----------
function parseLoc(loc) {
  if (!loc || !loc.startsWith("wrld_")) return { type: loc || "offline" };
  const [wid, rest = ""] = loc.split(":");
  const parts = rest.split("~");
  let type = "public", region = "";
  for (const p of parts.slice(1)) {
    const m = p.match(/^(\w+)(?:\((.*)\))?$/) || [];
    if (m[1] === "hidden") type = "friends+";
    else if (m[1] === "friends") type = "friends";
    else if (m[1] === "private") type = type === "invite+" ? type : "invite";
    else if (m[1] === "canRequestInvite") type = "invite+";
    else if (m[1] === "group") type = "group";
    else if (m[1] === "groupAccessType") type = m[2] === "public" ? "groupPublic" : m[2] === "plus" ? "group+" : "group";
    else if (m[1] === "region") region = m[2] || "";
  }
  return { type, wid, name: parts[0], region };
}
function itypeLabel(L2) { return (ITYPE[L2.type] || L2.type) + (L2.region ? " · " + L2.region.toUpperCase() : ""); }
function locLabel(loc, state) {
  if (state === "active") return t("onWeb");
  if (!loc || loc === "offline") return t("offlineLoc");
  if (loc === "private") return t("privateLoc");
  if (loc === "traveling") return t("traveling");
  const L2 = parseLoc(loc);
  return L2.wid ? (WORLDS[L2.wid]?.name || L2.wid) : loc;
}
function joinButtons(loc) {
  const L2 = parseLoc(loc);
  if (!L2.wid || !L2.name) return "";
  return `<span class="acts"><button class="mini-btn" title="${t("join")}" onclick="event.stopPropagation();doLaunch('${esc(loc)}')">${icon("rocket")}</button>
          <button class="mini-btn" title="${t("inviteMe")}" onclick="event.stopPropagation();doInvite('${esc(loc)}')">${icon("send")}</button></span>`;
}
async function doLaunch(loc) { const r = await api("launch", loc); toast(r?.ok ? t("launched") : t("errGeneric")); }
async function doInvite(loc) { const r = await api("invite_self", loc); toast(r?.ok ? t("inviteSent") : t("errGeneric")); }
function fmtDate(ts) { const m = (ts || "").match(/^(\d{4})\.(\d\d)\.(\d\d) (\d\d:\d\d)/); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}` : ts || ""; }
function fmtShort(ts) { const m = (ts || "").match(/^\d{4}\.(\d\d)\.(\d\d) (\d\d:\d\d)/); return m ? `${m[2]}/${m[1]} ${m[3]}` : ts || ""; }
function tsDate(ts) { return new Date(ts.replace(/^(\d{4})\.(\d\d)\.(\d\d) /, "$1-$2-$3T")); }
function fmtDur(ms) { const m = Math.max(1, Math.round(ms / 60000)); return m < 60 ? t("mins", m) : t("hours", Math.floor(m / 60), m % 60); }

// ---------- Incoming friends / worlds / notifications ----------
window.onFriends = (d) => {
  for (const k in FRIENDS) delete FRIENDS[k];
  d.list.forEach(f => FRIENDS[f.id] = f);
  friendsLoaded = d.loaded;
  buildNav();
  renderView();
};
window.onFriend = (f) => {
  FRIENDS[f.id] = f;
  buildNav();
  if (view === "friends") renderView();
  if (profileOpen === f.id) buildProfile();
};
window.onFriendRemoved = (uid) => { delete FRIENDS[uid]; buildNav(); renderView(); };
window.onPipeline = (on) => { pipelineOn = on; if (view === "friends") renderView(); };
window.onWorlds = (list) => {
  for (const w of list) WORLDS[w.id] = w;
  renderView();
  if (worldOpen && list.some(w => w.id === worldOpen)) buildWorld();
  else if (profileOpen) buildProfile();
};
window.onNotifs = (list) => { NOTIFS = list; buildNav(); if (view === "notifs") renderView(); };
window.onNewNotif = (n) => toast(t("newNotif", n.name || "?", t("n_" + n.type, n.worldName || "")));
window.onFeed = (list) => {
  feed.push(...list);
  if (feed.length > 5000) feed.splice(0, feed.length - 5000);
  if (view === "feed") renderView();
};

// ---------- Friends page ----------
function renderFriends() {
  const el = $("v_friends");
  if (!AUTH.loggedIn) return needLogin(el);
  if (!friendsLoaded) return emptyState(el, "refresh-cw", t("loadingFriends"));
  const list = Object.values(FRIENDS).filter(f => !query || (f.displayName || "").toLowerCase().includes(query)
    || locLabel(f.location, f.state).toLowerCase().includes(query));
  // Sections: in a visible world / in a private world / online on the web / offline
  const group = f => f.state !== "online" ? f.state : parseLoc(f.location).wid ? "online" : "private";
  const by = s => list.filter(f => group(f) === s).sort((a, b) => (a.displayName || "").localeCompare(b.displayName || ""));
  const scroll = el.scrollTop;
  el.innerHTML = "";
  for (const st of ["online", "private", "active", "offline"]) {
    const arr = by(st);
    if (st === "online") arr.sort((a, b) => (a.location || "").localeCompare(b.location || ""));  // Players in the same instance stay together
    if (st === "private" && !arr.length) continue;
    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = `${t("fs_" + st)} <span class="n">${arr.length}</span>` + (st === "online"
      ? `<span class="live ${pipelineOn ? "on" : ""}" style="margin-left:auto"><i></i>${t(pipelineOn ? "live" : "notLive")}</span>`
      : st === "offline" ? `<button class="btn" style="padding:3px 12px" onclick="S.showOffline=!S.showOffline;save();renderView()">${t(S.showOffline ? "hide" : "show")}</button>` : "");
    el.appendChild(head);
    if (st === "offline" && !S.showOffline) continue;
    const grid = document.createElement("div");
    grid.className = "fgrid";
    arr.forEach(f => grid.appendChild(friendCard(f)));
    el.appendChild(grid);
  }
  el.scrollTop = scroll;
}

function avatarWithDot(uid, name, state, status) {
  const wrap = document.createElement("span");
  wrap.className = "avwrap";
  wrap.append(makeAvatar(uid, name));
  if (state && state !== "offline") {
    const dot = state === "active" ? "var(--gray)" : STATUS_COLOR[(status || "").toLowerCase()] || "var(--green)";
    wrap.insertAdjacentHTML("beforeend", `<i class="sdot" style="background:${dot}"></i>`);
  }
  return wrap;
}

function friendCard(f) {
  const d = document.createElement("div");
  d.className = "fcard";
  const st = (f.status || "").toLowerCase();
  const L2 = parseLoc(f.location);
  d.innerHTML = `<span class="slot"></span><div class="info"><div class="nm"></div><div class="sub"></div>
    <div class="loc">${icon(f.state === "online" ? "map-pin" : f.state === "active" ? "monitor" : "clock")}<span></span>
    ${L2.wid ? `<span class="itype">${esc(itypeLabel(L2))}</span>` : ""}</div></div>${f.state === "online" ? joinButtons(f.location) : ""}`;
  d.querySelector(".slot").replaceWith(avatarWithDot(f.id, f.displayName || "?", f.state, f.status));
  d.querySelector(".nm").textContent = f.displayName || f.id;
  d.querySelector(".sub").textContent = f.statusDescription || (f.state !== "offline" ? L().st?.[st] || "" : "");
  d.querySelector(".loc span").textContent = locLabel(f.location, f.state);
  const bs = bannerStyle(f.id);  // Card background is that player's banner (image or color), like in game
  if (bs) { d.classList.add("bnr"); d.querySelector(".bnr-bg")?.remove(); d.insertAdjacentHTML("afterbegin", `<span class="bnr-bg" style="${bs}"></span>`); }
  d.onclick = () => showProfile(f.id, f.displayName);
  return d;
}

// ---------- Feed ----------
function buildFeedFilters(root) {
  $("filterTitle").textContent = t("feedFilter");
  const g = document.createElement("div");
  g.className = "group";
  for (const k of FEED_TYPES) {
    const [ic, col] = FEED_STYLE[k];
    const row = document.createElement("label");
    row.className = "toggle-row";
    row.innerHTML = `<span class="tile" style="--c:var(--${col})">${icon(ic)}</span><span class="label">${t("ft_" + k)}</span>
                     <span class="switch"><input type="checkbox" ${feedOn[k] ? "checked" : ""}></span>`;
    row.querySelector("input").onchange = (ev) => { feedOn[k] = ev.target.checked; S.feedEnabled = feedOn; save(); renderView(); };
    g.appendChild(row);
  }
  root.appendChild(g);
}

function feedText(e) {
  const d = e.d || {};
  switch (e.type) {
    case "online": return t("ff_online", locLabel(d.location));
    case "location": return t("ff_location", locLabel(d.location));
    case "name": return t("ff_name", d.old || "?", d.new || e.name);
    case "status": return t("ff_status", d.desc || L().st?.[(d.status || "").toLowerCase()] || d.status || "");
    default: return t("ff_" + e.type);
  }
}

let feedWorldsAsked = false;
function renderFeed() {
  const el = $("v_feed");
  const list = feed.filter(e => feedOn[e.type] && (!query || (e.name || "").toLowerCase().includes(query) || feedText(e).toLowerCase().includes(query)));
  if (!list.length) return emptyState(el, "activity", AUTH.loggedIn || feed.length ? t("noFeed") : t("needLogin"));
  if (!feedWorldsAsked) {  // Request world names for the latest feed entries (slowly, within the rate limit)
    feedWorldsAsked = true;
    const wids = [...new Set(feed.slice(-200).map(e => parseLoc(e.d?.location).wid).filter(Boolean))].slice(-30);
    api("worlds", wids);
  }
  const scroll = el.scrollTop;
  el.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const e of list.slice(-800).reverse()) {
    const [ic, col] = FEED_STYLE[e.type] || ["activity", "gray"];
    const r = document.createElement("div");
    r.className = "frow";
    r.innerHTML = `<span class="time"></span><span class="slot"></span><span class="nm"></span>
      <span class="what"><span class="tile" style="--c:var(--${col});width:20px;height:20px;border-radius:6px">${icon(ic)}</span><span></span></span>`;
    r.querySelector(".time").textContent = fmtShort(e.t);
    r.querySelector(".time").title = e.t;
    r.querySelector(".slot").replaceWith(makeAvatar(e.u, e.name));
    const nm = r.querySelector(".nm");
    nm.textContent = e.name || e.u;
    nm.onclick = () => showProfile(e.u, e.name);
    const what = r.querySelector(".what span:last-child");
    what.textContent = feedText(e);
    const wid = parseLoc(e.d?.location).wid;
    if (wid) { what.classList.add("link"); what.onclick = () => openWorld(wid, e.d.location); }
    frag.appendChild(r);
  }
  el.appendChild(frag);
  el.scrollTop = scroll;
}

// ---------- Notifications ----------
function renderNotifs() {
  const el = $("v_notifs");
  if (!AUTH.loggedIn) return needLogin(el);
  if (!NOTIFS.length) return emptyState(el, "bell", t("noNotifs"));
  el.innerHTML = "";
  for (const n of [...NOTIFS].sort((a, b) => (b.t || "").localeCompare(a.t || ""))) {
    const wid = parseLoc(n.world).wid;
    const wname = n.worldName || WORLDS[wid]?.name || "";
    const c = document.createElement("div");
    c.className = "ncard";
    const acts = n.type === "friendRequest"
      ? `<button class="btn primary" onclick="respond('${n.id}',true)">${t("accept")}</button><button class="btn" onclick="respond('${n.id}',false)">${t("decline")}</button>`
      : n.type === "invite"
        ? `<button class="btn primary" onclick="doLaunch('${esc(n.world)}')">${t("join")}</button><button class="btn" onclick="respond('${n.id}',false)">${t("dismiss")}</button>`
        : `<button class="btn" onclick="respond('${n.id}',false)">${t("dismiss")}</button>`;
    c.innerHTML = `<span class="slot"></span><div class="info"><div class="nm"></div><div class="sub"></div></div><div class="acts">${acts}</div>`;
    c.querySelector(".slot").replaceWith(makeAvatar(n.from, n.name));
    c.querySelector(".nm").textContent = n.name || n.from;
    c.querySelector(".nm").onclick = () => showProfile(n.from, n.name);
    const when = n.t ? new Date(n.t).toLocaleString(S.lang) : "";
    c.querySelector(".sub").textContent = `${t("n_" + n.type, wname)}${n.msg ? ` — “${n.msg}”` : ""} · ${when}`;
    el.appendChild(c);
  }
}
async function respond(id, accept) {
  const r = await api("notif_respond", id, accept);
  toast(r?.ok ? t(accept ? "accepted" : "dismissed") : t("errGeneric"));
}

// ---------- History ----------
async function loadHistory() {
  historyData = (await api("history")) || [];
  const wids = [...new Set(historyData.slice(0, 40).map(v => parseLoc(v.loc).wid).filter(Boolean))];
  api("worlds", wids);
  renderView();
}
function renderHistory() {
  const el = $("v_history");
  if (!historyData) return emptyState(el, "history", t("loading"));
  const list = historyData.filter(v => !query || v.name.toLowerCase().includes(query));
  if (!list.length) return emptyState(el, "history", t("noHistory"));
  const scroll = el.scrollTop;
  el.innerHTML = "";
  list.forEach((v, i) => {
    const L2 = parseLoc(v.loc), w = WORLDS[L2.wid];
    const ongoing = !v.end && v === historyData[0];
    const dur = v.end ? tsDate(v.end) - tsDate(v.t) : ongoing ? Date.now() - tsDate(v.t) : 0;
    const row = document.createElement("div");
    row.className = "hrow" + (histOpen.has(v.t) ? " open" : "");
    row.innerHTML = `<div class="hhead"><div class="thumb" ${w?.img ? `style="background-image:url('${w.img}')"` : ""}>${w?.img ? "" : icon("globe")}</div>
      <div class="info"><div class="nm"></div><div class="sub"><span>${fmtDate(v.t)}</span>${dur ? `<span>${fmtDur(dur)}${ongoing ? " · " + t("now") : ""}</span>` : ""}
      <span>${t("playersMet", v.players)}</span>${L2.wid ? `<span class="itype">${esc(itypeLabel(L2))}</span>` : ""}</div></div>
      ${L2.wid ? `<button class="mini-btn" title="${t("worldInfo")}" onclick="event.stopPropagation();openWorld('${L2.wid}','${esc(v.loc)}')">${icon("info")}</button>` : ""}
      <span class="chev">${icon("chevron-right")}</span></div><div class="hbody"></div>`;
    row.querySelector(".nm").textContent = v.name;
    row.querySelector(".hhead").onclick = () => {
      if (histOpen.has(v.t)) { histOpen.delete(v.t); row.classList.remove("open"); return; }
      histOpen.add(v.t); row.classList.add("open"); fillVisit(v, row);
    };
    if (histOpen.has(v.t)) fillVisit(v, row);
    el.appendChild(row);
  });
  el.scrollTop = scroll;
}
async function fillVisit(v, row) {
  const body = row.querySelector(".hbody");
  if (!histPlayers[v.t]) { body.textContent = t("loading"); histPlayers[v.t] = (await api("visit_players", v.t, v.end)) || []; }
  const ps = histPlayers[v.t];
  body.innerHTML = ps.length ? "" : `<span style="color:var(--text3)">${t("noPlayers")}</span>`;
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const p of ps) {
    const c = document.createElement("span");
    c.className = "chip";
    const s = document.createElement("span");
    s.textContent = p.name;
    c.append(makeAvatar(p.u, p.name), s);
    c.onclick = () => showProfile(p.u, p.name);
    chips.append(c);
  }
  body.append(chips);
}

// ---------- Search ----------
function renderSearch() {
  const el = $("v_search");
  if (!AUTH.loggedIn) return needLogin(el);
  if (!el.querySelector(".search-head")) {
    el.innerHTML = `<div class="search-head"><input class="field" id="sq" spellcheck="false"><div class="segmented" id="skind"></div>
      <button class="btn primary" onclick="doSearch()">${icon("search")}</button></div><div id="sres"></div>`;
    $("sq").onkeydown = e => { if (e.key === "Enter") doSearch(); };
  }
  $("sq").placeholder = t(searchKind === "users" ? "searchUsersPh" : "searchWorldsPh");
  $("skind").innerHTML = ["users", "worlds"].map(k =>
    `<button class="${searchKind === k ? "on" : ""}" onclick="searchKind='${k}';searchRes=null;renderSearch();doSearch()">${t("s_" + k)}</button>`).join("");
  const res = $("sres");
  if (searching) return res.innerHTML = `<div class="empty-state" style="height:200px">${t("searching")}</div>`;
  if (!searchRes) return res.innerHTML = "";
  if (searchRes.error) return res.innerHTML = `<div class="empty-state" style="height:200px">${t("errGeneric")}</div>`;
  if (!searchRes.ids.length) return res.innerHTML = `<div class="empty-state" style="height:200px">${t("noResults")}</div>`;
  res.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = searchRes.kind === "users" ? "fgrid" : "wgrid";
  for (const id of searchRes.ids) {
    if (searchRes.kind === "users") {
      const p = PROFILES[id] || {};
      const d = document.createElement("div");
      d.className = "fcard";
      d.innerHTML = `<span class="slot"></span><div class="info"><div class="nm"></div><div class="sub"></div></div>`;
      d.querySelector(".slot").replaceWith(makeAvatar(id, p.displayName || "?"));
      d.querySelector(".nm").textContent = p.displayName || id;
      d.querySelector(".sub").textContent = p.statusDescription || "";
      d.onclick = () => showProfile(id, p.displayName);
      grid.appendChild(d);
    } else {
      const w = WORLDS[id] || {};
      const d = document.createElement("div");
      d.className = "wcard";
      d.innerHTML = `<div class="wimg" ${w.img ? `style="background-image:url('${w.img}')"` : ""}></div><div class="winfo"><div class="nm"></div><div class="sub"></div></div>`;
      d.querySelector(".nm").textContent = w.name || id;
      d.querySelector(".sub").textContent = [w.authorName, w.capacity ? `${w.capacity} ${t("capacity")}` : ""].filter(Boolean).join(" · ");
      d.onclick = () => openWorld(id, "");
      grid.appendChild(d);
    }
  }
  res.appendChild(grid);
}
async function doSearch() {
  const q = $("sq")?.value.trim();
  if (!q) return;
  searching = true; renderSearch();
  const kind = searchKind;
  const r = await api("search", kind, q);
  searching = false;
  searchRes = { ...(r || { ids: [] }), kind };
  renderSearch();
}

// ---------- World info card ----------
function openWorld(wid, loc) {
  if (!wid) return;
  profileOpen = null; groupOpen = null; avatarOpen = null; worldOpen = wid; worldLoc = loc || "";
  buildWorld();
  $("pOverlay").classList.add("show");
  api("world", wid);
}
function buildWorld() {
  const w = WORLDS[worldOpen] || {};
  const card = $("pcard");
  card.classList.add("wide");
  const L2 = parseLoc(worldLoc);
  const stat = (v, label) => v || v === 0 ? `<span><b>${Number(v).toLocaleString()}</b> ${label}</span>` : "";
  card.innerHTML = `<div class="wc-hero" ${w.img ? `style="background-image:url('${w.img}')"` : ""}></div>
    <div class="pcard-body">
